<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zz 的旅遊部落格</title>
    <!-- 引入思源宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"Noto Serif TC"', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Noto Serif TC', serif; 
            background-color: #ffffff; 
            color: #452829; 
        }
        .custom-card {
            background-color: #EFE9E3;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .editor-btn {
            background-color: #EFE9E3;
            border: 1px solid #C9B59C;
            padding: 4px 8px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }
        .editor-btn:hover { opacity: 0.8; }
        /* 下拉選單懸浮子標籤樣式 */
        .dropdown-parent:hover .dropdown-child {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 前台畫面 -->
    <div id="frontend-view">
        <!-- 最上方 Logo 區 -->
        <header class="w-full py-6 bg-white shadow-sm border-b border-[#EFE9E3] flex flex-col items-center justify-center">
            <img id="site-logo" src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo" class="h-12 object-contain">
        </header>

        <!-- 動態母標籤與子標籤導覽列 -->
        <nav style="background-color: #C9B59C;" class="text-white shadow-md relative z-30">
            <ul id="frontend-nav-tabs" class="flex justify-center flex-wrap space-x-6 py-3 text-lg font-semibold">
                <li><a href="#" onclick="filterCategory('all')" class="hover:opacity-85 transition">首頁</a></li>
                <!-- 動態分類將由 JS 塞入 (支援母標籤與子標籤) -->
            </ul>
        </nav>

        <!-- 主體內容 -->
        <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- 左側/中間：動態切換 文章列表 或是 單篇完整文章 -->
            <section class="md:col-span-3 space-y-6" id="main-content-area">
                <!-- 這裡會由 JS 動態塞入文章列表或單篇詳細文章 -->
            </section>

            <!-- 右側：頭像與段落目錄 -->
            <aside class="space-y-6">
                <div class="custom-card p-6 rounded-xl shadow-sm border border-[#EFE9E3] text-center flex flex-col items-center">
                    <img id="site-avatar" src="https://via.placeholder.com/100?text=Avatar" alt="頭像" class="w-24 h-24 rounded-full object-cover mb-3 border-2 border-[#C9B59C]">
                    <h3 class="text-xl font-bold">zz</h3>
                    <p class="text-sm mt-1 opacity-90">一個隨筆紀錄的人</p>
                </div>

                <div class="custom-card p-6 rounded-xl shadow-sm border border-[#EFE9E3] sticky top-4">

                    <ul id="table-of-contents" class="text-sm space-y-2">

                    </ul>

            </aside>

    <!-- 後台管理畫面 (預設隱藏) -->

            <div class="space-x-4">
                <button onclick="switchView('frontend')" class="text-sm px-4 py-2 bg-white border border-[#C9B59C] rounded-lg hover:opacity-80">返回前台</button>
                <button onclick="logoutAdmin()" class="text-sm px-4 py-2 bg-red-500 text-white rounded-lg hover:opacity-80">登出系統</button>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-5">
            <!-- 左側頁籤 -->
            <aside class="bg-[#F9F6F0] p-6 border-r border-[#EFE9E3] space-y-2">
                <button onclick="switchAdminTab('avatar')" id="tab-avatar-btn" class="w-full text-left px-4 py-3 rounded-lg font-semibold transition bg-[#C9B59C] text-white">👤 頭像設定</button>
                <button onclick="switchAdminTab('logo')" id="tab-logo-btn" class="w-full text-left px-4 py-3 rounded-lg font-semibold transition hover:bg-[#EFE9E3]">🖼️ Logo 設定</button>
                <button onclick="switchAdminTab('categories')" id="tab-categories-btn" class="w-full text-left px-4 py-3 rounded-lg font-semibold transition hover:bg-[#EFE9E3]">🏷️ 文章分類</button>

            <!-- 右側內容區 -->

                <!-- 1. 頭像設定頁籤 -->

                <!-- 2. Logo 設定頁籤 -->

                    <h2 class="text-2xl font-bold border-b pb-2">更換 Logo</h2>
                    <input type="file" id="admin-logo-file" class="block w-full text-sm border p-2 rounded">

                </div>

                <!-- 3. 文章分類頁籤 (新增) -->
                <div id="admin-tab-categories" class="admin-tab-content space-y-6 hidden">
                    <h2 class="text-2xl font-bold border-b pb-2">文章分類管理 (支援母分類與子分類)</h2>

                <!-- 4. 文章管理頁籤 -->

                    <h2 class="text-2xl font-bold border-b pb-2">文章管理</h2>
                    <div class="flex space-x-4 border-b pb-4">

                        <button onclick="switchArticleSubTab('manage')" id="subtab-manage-btn" class="px-4 py-2 font-bold rounded bg-[#EFE9E3] hover:opacity-80">維護舊文章</button>
                    </div>

                    <!-- 子區塊 A：新增新文章 -->
                    <div id="sub-article-new" class="space-y-4">

                        <div>
                            <label class="block text-sm mb-1 font-semibold">文章標題</label>
                            <input type="text" id="new-article-title" class="w-full border p-2 rounded text-sm" placeholder="請輸入標題...">
                        </div>
                        <div>
                            <label class="block text-sm mb-1 font-semibold">文章分類</label>
                            <select id="new-article-category-select" class="w-full border p-2 rounded text-sm">
                                <!-- 動態填入可用分類 -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm mb-1 font-semibold">內文編輯器</label>
                            <!-- 工具列 -->
                            <div class="flex flex-wrap gap-2 mb-2 p-2 bg-[#F9F6F0] border rounded items-center">
                                <button type="button" class="editor-btn" onclick="formatText('bold')"><b>B</b></button>
                                <button type="button" class="editor-btn" onclick="formatText('italic')"><i>I</i></button>
                                <button type="button" class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
                                <button type="button" class="editor-btn" onclick="insertLink()">🔗 超連結</button>
                                
                                <!-- 段落選項 (第一階48、第二階36、第三階24、第四階18、內文12) -->

                                    <option value="h1">第一階標題 (48px)</option>
                                    <option value="h2">第二階標題 (36px)</option>
                                    <option value="h3">第三階標題 (24px)</option>
                                    <option value="h4">第四階標題 (18px)</option>

                                </select>

                                <!-- 文字大小 (數字呈現，支援預設及手動輸入) -->

                                    <span class="text-xs opacity-75">大小:</span>
                                    <input type="number" id="custom-font-size-input" class="w-12 text-xs text-center border rounded px-1 py-0.5" value="12" min="8" max="100" onchange="applyCustomFontSize(this.value)">
                                    <select class="text-xs border rounded bg-transparent cursor-pointer" onchange="document.getElementById('custom-font-size-input').value=this.value; applyCustomFontSize(this.value); this.value='';">
                                        <option value="">預設</option>
                                        <option value="12">12</option>
                                        <option value="18">18</option>
                                        <option value="24">24</option>
                                        <option value="36">36</option>
                                        <option value="48">48</option>
                                    </select>
                                </div>

                                <!-- 色彩選項 (#D90000, #3368A0 及自訂手動輸入) -->
                                <div class="flex items-center space-x-1 bg-white border border-[#C9B59C] rounded px-2 py-0.5">
                                    <span class="text-xs opacity-75">顏色:</span>
                                    <button type="button" class="w-4 h-4 rounded-full border border-gray-300" style="background-color: #D90000;" onclick="applyTextColor('#D90000')" title="預設紅 #D90000"></button>
                                    <button type="button" class="w-4 h-4 rounded-full border border-gray-300" style="background-color: #3368A0;" onclick="applyTextColor('#3368A0')" title="預設藍 #3368A0"></button>
                                    <input type="color" id="custom-color-picker" class="w-6 h-6 p-0 border-0 rounded cursor-pointer bg-transparent" onchange="applyTextColor(this.value)" title="自訂色號">
                                    <input type="text" id="custom-color-text" class="w-16 text-xs border rounded px-1 py-0.5 uppercase" placeholder="#HEX" onchange="applyTextColor(this.value)">
                                </div>
                            </div>
                            <div id="new-article-editor" contenteditable="true" class="w-full h-64 border p-3 rounded bg-white overflow-y-auto text-sm leading-relaxed" onkeydown="handleEditorKeyDown(event)"></div>
                        </div>
                        <div class="flex justify-end pt-2">

                        </div>
                    </div>

                    <!-- 子區塊 B：維護舊文章 -->
                    <div id="sub-article-manage" class="space-y-4 hidden">
                        <h3 class="text-lg font-semibold">選擇要修改或刪除的文章</h3>
                        <div id="admin-articles-list" class="space-y-2"><p class="text-sm opacity-75">載入中...</p></div>

                        <div id="edit-article-form" class="hidden space-y-4 border-t pt-4 mt-4">
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-md text-[#452829]" id="edit-form-heading">編輯文章</h4>
                                <button onclick="closeEditForm()" class="text-xs text-gray-500 hover:underline">取消編輯</button>
                            </div>
                            <input type="hidden" id="edit-article-id">
                            <div>
                                <label class="block text-sm mb-1 font-semibold">文章標題</label>
                                <input type="text" id="edit-article-title" class="w-full border p-2 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-sm mb-1 font-semibold">文章分類</label>
                                <select id="edit-article-category-select" class="w-full border p-2 rounded text-sm">
                                    <!-- 動態填入可用分類 -->
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm mb-1 font-semibold">內文編輯器</label>
                                <!-- 編輯工具列 -->
                                <div class="flex flex-wrap gap-2 mb-2 p-2 bg-[#F9F6F0] border rounded items-center">
                                    <button type="button" class="editor-btn" onclick="formatTextEdit('bold')"><b>B</b></button>
                                    <button type="button" class="editor-btn" onclick="formatTextEdit('italic')"><i>I</i></button>
                                    <button type="button" class="editor-btn" onclick="formatTextEdit('underline')"><u>U</u></button>
                                    <button type="button" class="editor-btn" onclick="insertLinkEdit()">🔗 超連結</button>
                                    
                                    <select class="editor-btn font-semibold" onchange="formatParagraphStyleEdit(this.value); this.value='';">

                                        <option value="h1">第一階標題 (48px)</option>
                                        <option value="h2">第二階標題 (36px)</option>
                                        <option value="h3">第三階標題 (24px)</option>
                                        <option value="h4">第四階標題 (18px)</option>
                                        <option value="p">一般內文 (12px)</option>
                                    </select>

                                    <div class="flex items-center space-x-1 bg-white border border-[#C9B59C] rounded px-2 py-0.5">
                                        <span class="text-xs opacity-75">大小:</span>
                                        <input type="number" id="edit-custom-font-size-input" class="w-12 text-xs text-center border rounded px-1 py-0.5" value="12" min="8" max="100" onchange="applyCustomFontSizeEdit(this.value)">
                                        <select class="text-xs border rounded bg-transparent cursor-pointer" onchange="document.getElementById('edit-custom-font-size-input').value=this.value; applyCustomFontSizeEdit(this.value); this.value='';">
                                            <option value="">預設</option>
                                            <option value="12">12</option>
                                            <option value="18">18</option>
                                            <option value="24">24</option>
                                            <option value="36">36</option>
                                            <option value="48">48</option>
                                        </select>
                                    </div>

                                    <div class="flex items-center space-x-1 bg-white border border-[#C9B59C] rounded px-2 py-0.5">
                                        <span class="text-xs opacity-75">顏色:</span>
                                        <button type="button" class="w-4 h-4 rounded-full border border-gray-300" style="background-color: #D90000;" onclick="applyTextColorEdit('#D90000')" title="預設紅 #D90000"></button>
                                        <button type="button" class="w-4 h-4 rounded-full border border-gray-300" style="background-color: #3368A0;" onclick="applyTextColorEdit('#3368A0')" title="預設藍 #3368A0"></button>

    <!-- 刪除確認 Modal -->
    <div id="delete-confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl text-center">
            <h3 class="font-bold text-lg text-[#452829]">⚠️ 確定要刪除這篇文章嗎？</h3>
            <p class="text-xs text-gray-500">刪除後將無法復原，請確認您的動作。</p>
            <input type="hidden" id="delete-target-id">
            <div class="flex justify-center space-x-4 pt-2">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:opacity-80">取消</button>
                <button onclick="confirmDeleteArticle()" class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm hover:opacity-80">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- 登入 Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-center">後台管理者登入</h3>
            <div>
                <label class="block text-xs mb-1">管理員信箱</label>
                <input type="email" id="admin-email-input" class="w-full text-sm border p-2 rounded" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs mb-1">密碼</label>
                <input type="password" id="admin-password-input" class="w-full text-sm border p-2 rounded" placeholder="••••••••">
            </div>
            <button onclick="loginWithEmail()" class="w-full text-white py-2 rounded-lg text-sm font-medium hover:opacity-90" style="background-color: #C9B59C;">登入後台</button>
            <div class="text-center">
                <button onclick="closeLoginModal()" class="text-xs text-gray-400 hover:text-gray-600">取消</button>
            </div>
        </div>
    </div>

    <!-- 右下角懸浮管理按鈕 -->
    <button id="floating-admin-btn" onclick="openAdminPanel()" class="hidden fixed bottom-6 right-6 text-white w-12 h-12 rounded-full shadow-lg hover:opacity-95 transition z-40 flex items-center justify-center text-xl" style="background-color: #C9B59C;" title="管理後台">
        ⚙️
    </button>

    <!-- 頁尾 -->
    <footer class="w-full py-4 text-center text-xs border-t border-[#EFE9E3] bg-white mt-12 opacity-80">
        @zz 轉載請註明出處
    </footer>

    <!-- Supabase 與互動邏輯 -->
    <script>
        const SUPABASE_URL = 'https://rpzqioezweftrjtrneos.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__8VdnjBQYgeFtPdArs4lww_4RJxrDye';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allArticlesCache = []; 
        let categoriesCache = []; // 儲存從資料庫抓取的分類清單

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchCategories();
            await fetchArticles();
            loadSettings();
            checkSessionState();
        });

        async function checkSessionState() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('floating-admin-btn').classList.remove('hidden');
            } else {
                document.getElementById('floating-admin-btn').classList.add('hidden');
            }
        }

        async function openAdminPanel() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                document.getElementById('login-modal').classList.remove('hidden');
            } else {
                switchView('admin');
            }
        }

        async function loginWithEmail() {
            const email = document.getElementById('admin-email-input').value;
            const password = document.getElementById('admin-password-input').value;
            if (!email || !password) return alert('請輸入帳號與密碼');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('登入失敗：' + error.message);
            } else {
                alert('登入成功！');
                closeLoginModal();
                document.getElementById('floating-admin-btn').classList.remove('hidden');
                switchView('admin');
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            alert('已登出');
            document.getElementById('floating-admin-btn').classList.add('hidden');
            switchView('frontend');
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function switchView(view) {
            if (view === 'admin') {
                document.getElementById('frontend-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                loadCategoriesAdmin();
                loadManageArticlesList();
            } else {
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('frontend-view').classList.remove('hidden');
                fetchCategories().then(() => fetchArticles());
                loadSettings();
            }
        }

        function switchAdminTab(tabName) {
            ['avatar', 'logo', 'categories', 'articles'].forEach(t => {
                document.getElementById(`admin-tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).classList.remove('bg-[#C9B59C]', 'text-white');
                document.getElementById(`tab-${t}-btn`).classList.add('hover:bg-[#EFE9E3]');
            });
            document.getElementById(`admin-tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}-btn`).classList.add('bg-[#C9B59C]', 'text-white');
            document.getElementById(`tab-${tabName}-btn`).classList.remove('hover:bg-[#EFE9E3]');

            if (tabName === 'categories') loadCategoriesAdmin();
            if (tabName === 'articles') updateCategoryDropdowns();
        }

        function switchArticleSubTab(sub) {
            if (sub === 'new') {
                document.getElementById('sub-article-new').classList.remove('hidden');
                document.getElementById('sub-article-manage').classList.add('hidden');
                document.getElementById('subtab-new-btn').classList.add('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-new-btn').classList.remove('bg-[#EFE9E3]');
                document.getElementById('subtab-manage-btn').classList.remove('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-manage-btn').classList.add('bg-[#EFE9E3]');
            } else {
                document.getElementById('sub-article-manage').classList.remove('hidden');
                document.getElementById('sub-article-new').classList.add('hidden');
                document.getElementById('subtab-manage-btn').classList.add('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-manage-btn').classList.remove('bg-[#EFE9E3]');
                document.getElementById('subtab-new-btn').classList.remove('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-new-btn').classList.add('bg-[#EFE9E3]');
                loadManageArticlesList();
            }
        }

        // ================= 編輯器進階控制 (字體大小、顏色、段落階層) =================
        function formatText(command) { document.execCommand(command, false, null); }
        function insertLink() {
            const url = prompt('請輸入超連結網址 (URL):');
            if (url) document.execCommand('createLink', false, url);
        }

        // 綁定段落選項與對應大小 (第一階48、第二階36、第三階24、第四階18、內文12)
        function formatParagraphStyle(tag) {
            if (!tag) return;
            if (tag === 'p') {
                document.execCommand('formatBlock', false, 'p');
                applyCustomFontSize(12);
            } else {
                document.execCommand('formatBlock', false, tag);
                if (tag === 'h1') applyCustomFontSize(48);
                if (tag === 'h2') applyCustomFontSize(36);
                if (tag === 'h3') applyCustomFontSize(24);
                if (tag === 'h4') applyCustomFontSize(18);
            }
        }

        function applyCustomFontSize(size) {
            if (!size) return;
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const span = document.createElement('span');
            span.style.fontSize = size + 'px';
            try {
                span.appendChild(selection.getRangeAt(0).extractContents());
                selection.getRangeAt(0).insertNode(span);
            } catch (e) {
                document.execCommand('fontSize', false, '3'); // fallback
            }
        }

        function applyTextColor(color) {
            if (!color) return;
            document.getElementById('custom-color-text').value = color;
            document.execCommand('foreColor', false, color);
        }

        // 換行時確保回歸一般內文 (12px, p 標籤)
        function handleEditorKeyDown(event) {
            if (event.key === 'Enter') {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const node = selection.anchorNode;
                // 若按下 enter，確保接下來打字為一般內文
                setTimeout(() => {
                    document.execCommand('formatBlock', false, 'p');
                    document.execCommand('fontSize', false, '3');
                }, 10);
            }
        }

        // 編輯舊文章的編輯器方法
        function formatTextEdit(command) { document.execCommand(command, false, null); }
        function insertLinkEdit() {
            const url = prompt('請輸入超連結網址 (URL):');
            if (url) document.execCommand('createLink', false, url);
        }
        function formatParagraphStyleEdit(tag) {
            if (!tag) return;
            if (tag === 'p') {
                document.execCommand('formatBlock', false, 'p');
                applyCustomFontSizeEdit(12);
            } else {
                document.execCommand('formatBlock', false, tag);
                if (tag === 'h1') applyCustomFontSizeEdit(48);
                if (tag === 'h2') applyCustomFontSizeEdit(36);
                if (tag === 'h3') applyCustomFontSizeEdit(24);
                if (tag === 'h4') applyCustomFontSizeEdit(18);
            }
        }
        function applyCustomFontSizeEdit(size) {
            if (!size) return;
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const span = document.createElement('span');
            span.style.fontSize = size + 'px';
            try {
                span.appendChild(selection.getRangeAt(0).extractContents());
                selection.getRangeAt(0).insertNode(span);
            } catch (e) {}
        }
        function applyTextColorEdit(color) {
            if (!color) return;
            document.execCommand('foreColor', false, color);
        }

        // ================= 分類管理與前台導覽列 =================
        async function fetchCategories() {
            const { data, error } = await supabaseClient.from('categories').select('*');
            if (error || !data || data.length === 0) {
                // 若無資料，給予預設分類
                categoriesCache = [
                    { id: '1', name: '國內旅遊', parent_id: null },
                    { id: '2', name: '中國旅遊', parent_id: null },
                    { id: '3', name: '韓國旅遊', parent_id: null }
                ];
            } else {
                categoriesCache = data;
            }
            renderFrontendNav();
        }

        // 渲染前台母標籤與子標籤（支援懸浮下拉選單）
        function renderFrontendNav() {
            const navUl = document.getElementById('frontend-nav-tabs');
            const parents = categoriesCache.filter(c => !c.parent_id);

            let html = `<li><a href="#" onclick="filterCategory('all')" class="hover:opacity-85 transition block py-1">首頁</a></li>`;

            parents.forEach(parent => {
                const children = categoriesCache.filter(c => c.parent_id === parent.id);
                if (children.length > 0) {
                    html += `
                        <li class="relative dropdown-parent">
                            <a href="#" onclick="filterCategory('${parent.name}')" class="hover:opacity-85 transition block py-1">${parent.name} ▾</a>
                            <ul class="dropdown-child hidden absolute left-0 top-full bg-[#C9B59C] shadow-lg rounded-b py-2 min-w-[140px] space-y-1 z-45">
                                ${children.map(child => `<li><a href="#" onclick="filterCategory('${child.name}')" class="block px-4 py-1 hover:bg-black hover:bg-opacity-10 text-sm">${child.name}</a></li>`).join('')}
                            </ul>
                        </li>
                    `;
                } else {
                    html += `<li><a href="#" onclick="filterCategory('${parent.name}')" class="hover:opacity-85 transition block py-1">${parent.name}</a></li>`;
                }
            });

            navUl.innerHTML = html;
        }

        async function loadCategoriesAdmin() {
            await fetchCategories();
            const listContainer = document.getElementById('admin-categories-list');
            const parentSelect = document.getElementById('new-cat-parent');

            parentSelect.innerHTML = `<option value="">無 (設為獨立母分類)</option>` + 
                categoriesCache.filter(c => !c.parent_id).map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            if (categoriesCache.length === 0) {
                listContainer.innerHTML = `<p class="text-sm opacity-75">目前尚無分類。</p>`;
                return;
            }

            listContainer.innerHTML = categoriesCache.map(cat => {
                const parent = categoriesCache.find(p => p.id === cat.parent_id);
                return `
                    <div class="p-3 bg-[#F9F6F0] border border-[#EFE9E3] rounded flex justify-between items-center text-sm">
                        <div>
                            <span class="font-bold">${cat.name}</span>
                            <span class="text-xs opacity-70 ml-2">${parent ? `(子分類屬於：${parent.name})` : '(母分類)'}</span>
                        </div>
                        <button onclick="deleteCategory('${cat.id}')" class="text-xs bg-red-500 text-white px-3 py-1.5 rounded hover:opacity-80">刪除分類</button>
                    </div>
                `;
            }).join('');
        }

        async function addNewCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            const parent_id = document.getElementById('new-cat-parent').value || null;
            if (!name) return alert('請輸入分類名稱');

            const { error } = await supabaseClient.from('categories').insert([{ name, parent_id }]);
            if (error) {
                alert('新增分類失敗：' + error.message);
            } else {
                alert('新增分類成功！');
                document.getElementById('new-cat-name').value = '';
                loadCategoriesAdmin();
            }
        }

        async function deleteCategory(id) {
            if (!confirm('確定要刪除此分類嗎？')) return;
            const { error } = await supabaseClient.from('categories').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('分類已刪除');
                loadCategoriesAdmin();
            }
        }

        function updateCategoryDropdowns() {
            ['new', 'edit'].forEach(type => {
                const select = document.getElementById(`${type}-article-category-select`);
                select.innerHTML = categoriesCache.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('');
            });
        }

        // ================= 文章取得與列表 =================
        async function fetchArticles(category = 'all') {
            const container = document.getElementById('main-content-area');
            let query = supabaseClient.from('articles').select('*').order('created_at', { ascending: false });
            
            if (category !== 'all') {
                query = query.eq('category', category);
            }

            const { data, error } = await query;
            if (error || !data || data.length === 0) {
                container.innerHTML = `<div class="custom-card p-6 rounded-xl border border-[#EFE9E3] shadow-sm">此分類目前尚無文章。</div>`;
                return;
            }

            allArticlesCache = data;

            container.innerHTML = data.map(article => `
                <article class="custom-card p-6 rounded-xl shadow-sm border border-[#EFE9E3] flex flex-col justify-between">
                    <div>
                        <span class="text-xs uppercase tracking-wider opacity-70">${article.category}</span>
                        <h2 class="text-2xl font-bold mt-1 mb-3 cursor-pointer hover:underline" onclick="viewSingleArticle('${article.id}')">${article.title}</h2>
                        <div class="line-clamp-2 leading-relaxed space-y-2 opacity-90 text-sm">${article.content}</div>
                    </div>
                    <div class="flex justify-end mt-4">
                        <button onclick="viewSingleArticle('${article.id}')" class="text-sm font-semibold hover:opacity-75 transition" style="color: #452829;">
                            ...查看更多
                        </button>
                    </div>
                </article>
            `).join('');

            document.getElementById('table-of-contents').innerHTML = `<li><span class="opacity-75">點擊文章查看目錄</span></li>`;
        }

        function viewSingleArticle(id) {
            const article = allArticlesCache.find(art => art.id == id);
            if (!article) return;

            const container = document.getElementById('main-content-area');
            container.innerHTML = `
                <div class="mb-4">
                    <button onclick="fetchArticles('all')" class="text-sm px-4 py-2 bg-[#EFE9E3] border border-[#C9B59C] rounded-lg hover:opacity-85 font-semibold">← 返回文章列表</button>
                </div>
                <article class="space-y-6">
                    <span class="text-xs uppercase tracking-wider opacity-70">${article.category}</span>
                    <h2 class="text-3xl font-bold text-[#452829]">${article.title}</h2>
                    <div id="article-body-content" class="leading-relaxed space-y-4 text-base pt-2">${article.content}</div>
                </article>
            `;

            generateArticleTOC();
        }

        function filterCategory(cat) { fetchArticles(cat); }

        function generateArticleTOC() {
            const body = document.getElementById('article-body-content');
            if (!body) return;
            const headings = body.querySelectorAll('h1, h2, h3, h4');
            const tocContainer = document.getElementById('table-of-contents');

            if (headings.length === 0) {
                tocContainer.innerHTML = `<li><span class="opacity-75">此文章無段落標題</span></li>`;
                return;
            }

            tocContainer.innerHTML = Array.from(headings).map((h, index) => {
                const tag = h.tagName.toLowerCase();
                let indent = 'pl-0';
                if (tag === 'h2') indent = 'pl-3';
                if (tag === 'h3') indent = 'pl-6';
                if (tag === 'h4') indent = 'pl-9';

                if (!h.id) h.id = `heading-${index}`;

                return `<li class="${indent}"><a href="#${h.id}" class="hover:opacity-80 transition block truncate">• ${h.innerText}</a></li>`;
            }).join('');
        }

        async function loadSettings() {
            const { data } = await supabaseClient.from('settings').select('*');
            if (data) {
                data.forEach(item => {
                    if (item.key === 'logo') document.getElementById('site-logo').src = item.value;
                    if (item.key === 'avatar') document.getElementById('site-avatar').src = item.value;
                });
            }
        }

        async function uploadAsset(type) {
            const fileInput = document.getElementById(`admin-${type}-file`);
            if (fileInput.files.length === 0) return alert('請先選擇檔案');
            const file = fileInput.files[0];
            
            const { data, error } = await supabaseClient.storage.from('blog-assets').upload(`${type}_${Date.now()}`, file);
            if (error) return alert('上傳失敗：' + error.message);

            const publicUrl = supabaseClient.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;
            await supabaseClient.from('settings').upsert({ key: type, value: publicUrl });
            alert('上傳並更新成功！');
            loadSettings();
        }

        async function publishNewArticle() {
            const title = document.getElementById('new-article-title').value;
            const category = document.getElementById('new-article-category-select').value;
            const content = document.getElementById('new-article-editor').innerHTML;

            if (!title || !category || !content.trim()) return alert('標題、分類與內文皆不得為空');

            const { error } = await supabaseClient.from('articles').insert([{ title, category, content }]);
            if (error) {
                alert('發布失敗：' + error.message);
            } else {
                alert('發布成功！');
                document.getElementById('new-article-title').value = '';
                document.getElementById('new-article-editor').innerHTML = '';
            }
        }

        async function loadManageArticlesList() {
            const listContainer = document.getElementById('admin-articles-list');
            const { data, error } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = `<p class="text-sm opacity-75">目前尚無文章可供維護。</p>`;
                return;
            }

            allArticlesCache = data;
            updateCategoryDropdowns();

            listContainer.innerHTML = data.map(art => `
                <div class="p-3 bg-[#F9F6F0] border border-[#EFE9E3] rounded flex justify-between items-center">
                    <div>
                        <span class="text-xs opacity-70 uppercase">[${art.category}]</span>
                        <h4 class="font-bold text-sm">${art.title}</h4>
                    </div>
                    <div class="space-x-2">
                        <button onclick="loadArticleToEdit('${art.id}')" class="text-xs bg-[#C9B59C] text-white px-3 py-1.5 rounded hover:opacity-80">修改</button>
                        <button onclick="openDeleteModal('${art.id}')" class="text-xs bg-red-500 text-white px-3 py-1.5 rounded hover:opacity-80">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        function loadArticleToEdit(id) {
            const article = allArticlesCache.find(art => art.id == id);
            if (!article) return;

            document.getElementById('edit-article-id').value = article.id;
            document.getElementById('edit-article-title').value = article.title;
            document.getElementById('edit-article-editor').innerHTML = article.content;
            document.getElementById('edit-article-category-select').value = article.category;

            document.getElementById('edit-form-heading').innerText = `編輯文章：${article.title}`;
            document.getElementById('edit-article-form').classList.remove('hidden');
        }

        function closeEditForm() {
            document.getElementById('edit-article-form').classList.add('hidden');
        }

        async function updateExistingArticle() {
            const id = document.getElementById('edit-article-id').value;
            const title = document.getElementById('edit-article-title').value;
            const category = document.getElementById('edit-article-category-select').value;
            const content = document.getElementById('edit-article-editor').innerHTML;

            if (!title || !category || !content.trim()) return alert('標題、分類與內文皆不得為空');

            const { error } = await supabaseClient.from('articles').update({ title, category, content }).eq('id', id);
            if (error) {
                alert('更新失敗：' + error.message);
            } else {
                alert('文章更新成功！');
                closeEditForm();
                loadManageArticlesList();
            }
        }

        function openDeleteModal(id) {
            document.getElementById('delete-target-id').value = id;
            document.getElementById('delete-confirm-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('delete-confirm-modal').classList.add('hidden');
        }

        async function confirmDeleteArticle() {
            const id = document.getElementById('delete-target-id').value;
            if (!id) return;

            const { error } = await supabaseClient.from('articles').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('文章已成功刪除！');
                closeDeleteModal();
                loadManageArticlesList();
            }
        }
    </script>
</body>
</html>
