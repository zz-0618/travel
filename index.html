="block">• ${esc(h.innerText)}</a></li>`}).join(''):'<li>此文章無段落標題</li>'}
async function checkSessionState(){const{data:{session}}=await supabaseClient.auth.getSession();$('floating-btn-text').innerText=session?'管理後台':'管理員登入'}async function openAdminPanel(){const{data:{session}}=await supabaseClient.auth.getSession();session?switchView('admin'):$('login-modal').classList.remove('hidden')}async function loginWithEmail(){const email=$('admin-email-input').value,password=$('admin-password-input').value;if(!email||!password)return alert('請輸入帳號與密碼');const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return alert('登入失敗：'+error.message);$('login-modal').classList.add('hidden');checkSessionState();switchView('admin')}async function logoutAdmin(){await supabaseClient.auth.signOut();checkSessionState();switchView('frontend')}function closeLoginModal(){$('login-modal').classList.add('hidden')}function switchView(v){$('frontend-view').classList.toggle('hidden',v==='admin');$('admin-view').classList.toggle('hidden',v!=='admin');v==='admin'?(loadCategoriesAdmin(),loadManageArticlesList()):goHome()}function switchAdminTab(n){['avatar','logo','categories','articles'].forEach(t=>{$('admin-tab-'+t).classList.toggle('hidden',t!==n);$('tab-'+t+'-btn').classList.toggle('bg-[#C9B59C]',t===n);$('tab-'+t+'-btn').classList.toggle('text-white',t===n)});if(n==='categories')loadCategoriesAdmin();if(n==='articles')populateArticleParentDropdowns()}function switchArticleSubTab(s){$('sub-article-new').classList.toggle('hidden',s!=='new');$('sub-article-manage').classList.toggle('hidden',s!=='manage');if(s==='manage')loadManageArticlesList()}
async function loadCategoriesAdmin(){await fetchCategories();const p=categoriesCache.filter(c=>!c.parent_id);$('new-cat-parent').innerHTML='<option value="">無（設為母分類）</option>'+p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('admin-categories-tree').innerHTML=p.map(x=>`<div class="p-3 border rounded space-y-2"><div class="flex flex-wrap items-center gap-2"><b>📁 ${esc(x.name)}</b><input id="cat-slug-${x.id}" value="${esc(x.slug||'')}" class="border rounded px-2 py-1 text-sm" placeholder="網址後綴"><button onclick="updateCategorySlug('${x.id}')" class="text-xs bg-[#C9B59C] text-white px-2 py-1 rounded">儲存網址</button><button onclick="deleteCategory('${x.id}')" class="ml-auto text-xs bg-red-500 text-white px-2 py-1 rounded">刪除</button></div><div class="pl-6 space-y-2">${categoriesCache.filter(c=>c.parent_id===x.id).map(y=>`<div class="flex flex-wrap items-center gap-2">└ <span>${esc(y.name)}</span><input id="cat-slug-${y.id}" value="${esc(y.slug||'')}" class="border rounded px-2 py-1 text-sm" placeholder="網址後綴"><button onclick="updateCategorySlug('${y.id}')" class="text-xs bg-[#C9B59C] text-white px-2 py-1 rounded">儲存網址</button><button onclick="deleteCategory('${y.id}')" class="text-xs text-red-600">刪除</button></div>`).join('')}</div></div>`).join('')}async function addNewCategory(){const name=$('new-cat-name').value.trim(),slug=normalizeSlug($('new-cat-slug').value),parent_id=$('new-cat-parent').value||null;if(!name||!slug)return alert('請輸入分類名稱與網址後綴');const{error}=await supabaseClient.from('categories').insert([{name,slug,parent_id}]);if(error)return alert(error.message);$('new-cat-name').value='';$('new-cat-slug').value='';loadCategoriesAdmin()}async function updateCategorySlug(id){try{const slug=normalizeSlug($('cat-slug-'+id).value);if(!slug)return alert('請輸入有效網址後綴');const original=categoriesCache.find(c=>String(c.id)===String(id));if(!original)throw new Error('找不到分類資料，請重新整理後再試');const payload={...original,slug};const{data,error}=await supabaseClient.from('categories').upsert(payload,{onConflict:'id'}).select().single();if(error)throw error;const index=categoriesCache.findIndex(c=>String(c.id)===String(id));if(index!==-1)categoriesCache[index]=data;alert('分類網址已更新');await loadCategoriesAdmin()}catch(e){console.error('分類網址更新失敗：',e);alert('分類網址更新失敗：'+(e?.message||String(e)))}}async function deleteCategory(id){if(!confirm('確定刪除？'))return;const{error}=await supabaseClient.from('categories').delete().eq('id',id);if(error)return alert(error.message);loadCategoriesAdmin()}
function populateArticleParentDropdowns(){['new','edit'].forEach(t=>{const p=categoriesCache.filter(c=>!c.parent_id);$(t+'-article-parent-select').innerHTML='<option value="">請選擇母標籤</option>'+p.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');$(t+'-article-child-select').innerHTML='<option value="">請先選擇母標籤</option>'})}function updateChildDropdown(t,selected=''){const n=$(t+'-article-parent-select').value,p=categoriesCache.find(c=>c.name===n&&!c.parent_id),ch=p?categoriesCache.filter(c=>c.parent_id===p.id):[];$(t+'-article-child-select').innerHTML='<option value="">(不選子標籤)</option>'+ch.map(x=>`<option value="${esc(x.name)}" ${x.name===selected?'selected':''}>${esc(x.name)}</option>`).join('')}async function slugExists(slug,exclude=null){let q=supabaseClient.from('articles').select('id').ilike('slug',slug).limit(1);if(exclude)q=q.neq('id',exclude);const{data,error}=await q;if(error)throw error;return!!data?.length}
async function publishNewArticle(){const title=$('new-article-title').value.trim(),category=$('new-article-parent-select').value,subcategory=$('new-article-child-select').value,content=$('new-article-editor').innerHTML.trim(),slug=normalizeSlug($('new-article-slug').value)||fallbackSlug();if(!title||!category)return alert('請輸入標題並選擇母標籤');try{if(await slugExists(slug))return alert('文章網址後綴已被使用');const now=new Date().toISOString(),{data,error}=await supabaseClient.from('articles').insert([{title,category,subcategory,content,slug,created_at:now,updated_at:now}]).select().single();if(error)throw error;alert('發布成功！\n'+location.origin+articlePath(data));await fetchArticles()}catch(e){alert('發布失敗：'+e.message)}}async function loadManageArticlesList(){const{data,error}=await supabaseClient.from('articles').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);allArticlesCache=data||[];populateArticleParentDropdowns();$('admin-articles-list').innerHTML=allArticlesCache.map(a=>`<div class="p-3 bg-[#F9F6F0] border rounded flex justify-between"><div><b>${esc(a.title)}</b><div class="text-xs opacity-60">${esc(articlePath(a))}</div></div><div><button onclick="loadArticleToEdit('${a.id}')" class="text-xs bg-[#C9B59C] text-white px-3 py-1 rounded">修改</button> <button onclick="deleteArticle('${a.id}')" class="text-xs bg-red-500 text-white px-3 py-1 rounded">刪除</button></div></div>`).join('')}function loadArticleToEdit(id){const a=allArticlesCache.find(x=>x.id==id);if(!a)return;$('edit-article-id').value=a.id;$('edit-article-title').value=a.title;$('edit-article-slug').value=a.slug||'';$('edit-article-editor').innerHTML=a.content||'';$('edit-article-parent-select').value=a.category||'';updateChildDropdown('edit',a.subcategory||'');$('edit-article-form').classList.remove('hidden')}function closeEditForm(){$('edit-article-form').classList.add('hidden')}async function updateExistingArticle(){const id=$('edit-article-id').value,title=$('edit-article-title').value.trim(),category=$('edit-article-parent-select').value,subcategory=$('edit-article-child-select').value,content=$('edit-article-editor').innerHTML.trim(),slug=normalizeSlug($('edit-article-slug').value)||fallbackSlug();if(!title||!category)return alert('請輸入標題並選擇母標籤');try{if(await slugExists(slug,id))return alert('文章網址後綴已被使用');const original=allArticlesCache.find(a=>a.id==id),{error}=await supabaseClient.from('articles').upsert({id:original.id,title,category,subcategory,content,slug,created_at:original.created_at,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;alert('文章更新成功');closeEditForm();loadManageArticlesList()}catch(e){alert('更新失敗：'+e.message)}}async function deleteArticle(id){if(!confirm('確定刪除這篇文章？'))return;const{error}=await supabaseClient.from('articles').delete().eq('id',id);if(error)return alert(error.message);loadManageArticlesList()}
async function loadSettings(){const{data}=await supabaseClient.from('settings').select('*');(data||[]).forEach(x=>{if(x.key==='logo')$('site-header-bg').style.backgroundImage=`url('${x.value}')`;if(x.key==='avatar')$('site-avatar').src=x.value})}async function uploadAsset(t){const file=$('admin-'+t+'-file').files[0];if(!file)return alert('請先選擇檔案');const{data,error}=await supabaseClient.storage.from('blog-assets').upload(`${t}_${Date.now()}_${file.name}`,file);if(error)return alert(error.message);const url=supabaseClient.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;const{error:e}=await supabaseClient.from('settings').upsert({key:t,value:url});if(e)return alert(e.message);alert('更新成功');loadSettings()}
