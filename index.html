function listArticles(cat='all'){let list=articles;if(cat!=='all'){const c=catByName(cat);if(c&&!c.parent_id){const names=[c.name,...categories.filter(x=>String(x.parent_id)===String(c.id)).map(x=>x.name)];list=list.filter(a=>names.includes(a.category)||names.includes(a.subcategory))}else list=list.filter(a=>a.category===cat||a.subcategory===cat)}$('floating-toc').classList.add('hidden');$('main-content-area').innerHTML=list.length?list.map(a=>`<article class="custom-card p-6 rounded-xl shadow-sm"><div class="text-xs opacity-70">${esc(a.category)}${a.subcategory?' / '+esc(a.subcategory):''}</div><h2 class="text-2xl font-bold mt-1"><a href="${articlePath(a)}" onclick="event.preventDefault();showArticle('${a.id}')">${esc(a.title)}</a></h2><div class="line-clamp-2 mt-3 article-content-style">${a.content||''}</div><div class="text-right mt-4"><a href="${articlePath(a)}" onclick="event.preventDefault();showArticle('${a.id}')" class="font-semibold">...查看更多</a></div></article>`).join(''):'<div class="custom-card p-6 rounded">目前尚無文章。</div>'}
function renderTravel(){const data=[...travel].sort((a,b)=>String(a.start).localeCompare(String(b.start)));$('floating-toc').classList.add('hidden');$('main-content-area').innerHTML=`<section class="py-3"><div class="text-sm tracking-[.22em] font-semibold text-[#7E9B82] border-b-2 border-[#A9C79D] inline-block pb-1">TRAVEL TIMELINE</div><h1 class="text-4xl md:text-5xl font-bold mt-7 leading-[1.5]">我的近幾年旅行足跡</h1><div class="travel-timeline">${data.length?data.map(x=>`<article class="travel-item"><span class="travel-dot"></span><div class="travel-date">${formatMonthRange(x.start,x.end)}</div><div class="travel-name">${esc(x.name)}</div></article>`).join(''):'<p class="opacity-60">目前尚未新增旅途。</p>'}</div></section>`}function formatMonthRange(s,e){const [sy,sm]=String(s).split('-'),[ey,em]=String(e||s).split('-');if(!sy)return'';if(s===e||!e)return`${sy} 年 ${Number(sm)} 月`;if(sy===ey)return`${sy} 年 ${Number(sm)}–${Number(em)} 月`;return`${sy} 年 ${Number(sm)} 月～${ey} 年 ${Number(em)} 月`}
async function home(){push('/');document.title='zz 的旅遊部落格';listArticles();scrollTo({top:0});showAnnouncement()}function categoryPage(n,history=true){const c=catByName(n);if(history)push(catPath(n));document.title=`${n}｜zz 的旅遊部落格`;if(c&&!c.parent_id&&c.name==='我的旅途')renderTravel();else listArticles(n);scrollTo({top:0})}function showArticle(id,history=true){const a=articles.find(x=>String(x.id)===String(id));if(!a)return;if(history)push(articlePath(a));document.title=`${a.title}｜zz 的旅遊部落格`;$('floating-toc').classList.remove('hidden');$('main-content-area').innerHTML=`<div class="mb-5 flex justify-between"><button onclick="home()" class="px-4 py-2 bg-[#EFE9E3] border rounded">← 返回文章列表</button><button onclick="navigator.clipboard.writeText(location.href)" class="px-3 py-2 border rounded">🔗 複製網址</button></div><nav class="mb-4 text-sm opacity-60"><a href="/" onclick="event.preventDefault();home()">首頁</a> › ${esc(a.category)}${a.subcategory?' › '+esc(a.subcategory):''} › ${esc(a.title)}</nav><article><h1 class="text-3xl md:text-4xl font-bold leading-[1.5]">${esc(a.title)}</h1><div class="flex gap-5 text-sm opacity-60 border-b py-4"><span>最初撰寫：${dateTW(a.created_at)}</span><span>最後更新：${dateTW(a.updated_at)}</span></div><div id="article-body-content" class="article-content-style pt-6">${a.content||''}</div></article>`;makeTOC();scrollTo({top:0})}function dateTW(v){return v?new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v)):''}function makeTOC(){const hs=document.querySelectorAll('#article-body-content h1,#article-body-content h2,#article-body-content h3,#article-body-content h4');$('table-of-contents').innerHTML=hs.length?[...hs].map((h,i)=>{h.id=h.id||'heading-'+i;return`<li style="padding-left:${(+h.tagName[1]-1)*12}px"><a href="#${h.id}" onclick="toggleTOC(false)">• ${esc(h.innerText)}</a></li>`}).join(''):'<li>此文章無段落標題</li>'}function toggleTOC(o){$('toc-panel').classList.toggle('hidden',!o);$('toc-open-btn').classList.toggle('hidden',o)}
async function route(){const parts=decodeURIComponent(location.pathname).split('/').filter(Boolean);if(!parts.length||parts[0]==='index.html'){listArticles();showAnnouncement();return}const full='/'+parts.join('/'),a=articles.find(x=>decodeURIComponent(articlePath(x)).toLowerCase()===full.toLowerCase());if(a)return showArticle(a.id,false);const c=categories.find(x=>decodeURIComponent(catPath(x.name)).toLowerCase()===full.toLowerCase());if(c)return categoryPage(c.name,false);$('main-content-area').innerHTML='<div class="custom-card p-8 rounded text-center"><h2 class="text-2xl font-bold">找不到這個頁面</h2></div>'}
function applySettings(){if(settings.logo)$('site-header-bg').style.backgroundImage=`url('${settings.logo}')`;if(settings.avatar)$('site-avatar').src=settings.avatar;$('site-nickname').textContent=settings.nickname||'zz';$('site-bio').textContent=settings.bio||'一個隨筆紀錄的人';renderNav();fillAdmin()}function todayTW(){const q=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o=Object.fromEntries(q.map(x=>[x.type,x.value]));return`${o.year}-${o.month}-${o.day}`}function showAnnouncement(){const t=todayTW(),ok=settings.announcement_enabled==='true'&&settings.announcement_content&&settings.announcement_start<=t&&t<=settings.announcement_end;if(!ok)return closeAnnouncement();$('announcement-modal-title').textContent=settings.announcement_title||'網站公告';$('announcement-modal-content').textContent=settings.announcement_content;$('announcement-modal').classList.remove('hidden');document.body.style.overflow='hidden'}function closeAnnouncement(){$('announcement-modal').classList.add('hidden');document.body.style.overflow=''}
function renderAdminTabs(){const tabs=[['account','👤 帳號管理'],['logo','🖼️ Logo 設定'],['announcement','📢 公告'],['categories','🏷️ 文章分類'],['travel','🧳 我的旅途'],['articles','📝 文章管理']];$('admin-tabs').innerHTML=tabs.map((x,i)=>`<button id="tab-${x[0]}" onclick="adminTab('${x[0]}')" class="w-full text-left px-4 py-3 rounded-lg ${i?'':'bg-[#C9B59C] text-white'}">${x[1]}</button>`).join('')}function adminTab(n){document.querySelectorAll('.admin-tab').forEach(x=>x.classList.toggle('hidden',x.id!==`admin-tab-${n}`));document.querySelectorAll('#admin-tabs button').forEach(x=>{x.classList.toggle('bg-[#C9B59C]',x.id===`tab-${n}`);x.classList.toggle('text-white',x.id===`tab-${n}`)});if(n==='categories')renderCategoryAdmin();if(n==='travel')renderTravelAdmin();if(n==='articles')populateParentSelects()}function fillAdmin(){$('admin-nickname').value=settings.nickname||'zz';$('admin-bio').value=settings.bio||'一個隨筆紀錄的人';$('announcement-enabled').checked=settings.announcement_enabled==='true';$('announcement-title').value=settings.announcement_title||'';$('announcement-content').value=settings.announcement_content||'';$('announcement-start').value=settings.announcement_start||'';$('announcement-end').value=settings.announcement_end||''}
async function sessionState(){return(await db.auth.getSession()).data.session}async function openAdmin(){(await sessionState())?switchView('admin'):$('login-modal').classList.remove('hidden')}async function loginAdmin(){const{error}=await db.auth.signInWithPassword({email:$('admin-email-input').value,password:$('admin-password-input').value});if(error)return alert(error.message);$('login-modal').classList.add('hidden');switchView('admin')}async function logoutAdmin(){await db.auth.signOut();switchView('frontend')}function switchView(v){$('frontend-view').classList.toggle('hidden',v==='admin');$('admin-view').classList.toggle('hidden',v!=='admin');if(v==='frontend')home();else{fillAdmin();renderCategoryAdmin();renderTravelAdmin();loadArticleAdmin()}}
async function saveProfile(){const nickname=$('admin-nickname').value.trim(),bio=$('admin-bio').value.trim();if(!nickname)return alert('暱稱不可空白');try{await saveSettings({nickname,bio});applySettings();alert('已儲存')}catch(e){alert(e.message)}}async function saveAnnouncement(){const obj={announcement_enabled:String($('announcement-enabled').checked),announcement_title:$('announcement-title').value.trim(),announcement_content:$('announcement-content').value.trim(),announcement_start:$('announcement-start').value,announcement_end:$('announcement-end').value};if(obj.announcement_enabled==='true'&&(!obj.announcement_content||!obj.announcement_start||!obj.announcement_end))return alert('請填寫內容及日期');if(obj.announcement_start>obj.announcement_end)return alert('開始日期不可晚於結束日期');try{await saveSettings(obj);alert('已儲存')}catch(e){alert(e.message)}}async function uploadAsset(t){const f=$('admin-'+t+'-file').files[0];if(!f)return alert('請先選擇檔案');const name=f.name.replace(/[^A-Za-z0-9._-]/g,'_'),{data,error}=await db.storage.from('blog-assets').upload(`${t}_${Date.now()}_${name}`,f);if(error)return alert(error.message);const url=db.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;await saveSettings({[t]:url});applySettings();alert('更新成功')}
function normalizedOrder(){const o=orderIds(),parents=sortedCats(categories).map(x=>String(x.id));const children={};parents.forEach(id=>children[id]=sortedCats(categories,id).map(x=>String(x.id)));return{parents,children}}function renderCategoryAdmin(){const p=sortedCats(categories);$('new-cat-parent').innerHTML='<option value="">無（設為母分類）</option>'+p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('admin-categories-tree').innerHTML=p.map((x,pi)=>`<div class="p-3 border rounded space-y-2"><div class="sort-row"><b class="flex-1">📁 ${esc(x.name)}</b><button onclick="moveCat(null,'${x.id}',-1)" ${pi===0?'disabled':''}>↑</button><button onclick="moveCat(null,'${x.id}',1)" ${pi===p.length-1?'disabled':''}>↓</button><input id="cat-slug-${x.id}" value="${esc(x.slug||'')}" class="border rounded px-2 py-1 text-sm w-32"><button onclick="saveCatSlug('${x.id}')">儲存</button><button onclick="deleteCat('${x.id}')" class="text-red-600">刪除</button></div><div class="pl-5 space-y-2">${sortedCats(categories,x.id).map((y,yi,arr)=>`<div class="sort-row"><span class="flex-1">└ ${esc(y.name)}</span><button onclick="moveCat('${x.id}','${y.id}',-1)" ${yi===0?'disabled':''}>↑</button><button onclick="moveCat('${x.id}','${y.id}',1)" ${yi===arr.length-1?'disabled':''}>↓</button><input id="cat-slug-${y.id}" value="${esc(y.slug||'')}" class="border rounded px-2 py-1 text-sm w-32"><button onclick="saveCatSlug('${y.id}')">儲存</button><button onclick="deleteCat('${y.id}')" class="text-red-600">刪除</button></div>`).join('')}</div></div>`).join('')}
async function moveCat(parent,id,dir){let o=normalizedOrder(),arr=parent?o.children[parent]:o.parents,idx=arr.indexOf(String(id)),to=idx+dir;if(idx<0||to<0||to>=arr.length)return;[arr[idx],arr[to]]=[arr[to],arr[idx]];try{await saveSettings({category_order:o});renderNav();renderCategoryAdmin();populateParentSelects()}catch(e){alert(e.message)}}async function addCategory(){const name=$('new-cat-name').value.trim(),slug=norm($('new-cat-slug').value),parent_id=$('new-cat-parent').value||null;if(!name||!slug)return alert('請輸入分類名稱與網址後綴');const{data,error}=await db.from('categories').insert([{name,slug,parent_id}]).select().single();if(error)return alert(error.message);categories.push(data);await saveSettings({category_order:normalizedOrder()});$('new-cat-name').value='';$('new-cat-slug').value='';renderCategoryAdmin();renderNav()}async function saveCatSlug(id){const slug=norm($('cat-slug-'+id).value);if(!slug)return alert('網址後綴無效');const{data,error}=await db.from('categories').update({slug}).eq('id',id).select().single();if(error)return alert(error.message);categories[categories.findIndex(x=>String(x.id)===String(id))]=data;renderNav();renderCategoryAdmin()}async function deleteCat(id){if(!confirm('確定刪除？'))return;const{error}=await db.from('categories').delete().eq('id',id);if(error)return alert(error.message);categories=categories.filter(x=>String(x.id)!==String(id));await saveSettings({category_order:normalizedOrder()});renderNav();renderCategoryAdmin()}
function renderTravelAdmin(){const sorted=[...travel].sort((a,b)=>String(a.start).localeCompare(String(b.start)));$('admin-travel-list').innerHTML=sorted.length?sorted.map(x=>`<div class="p-3 bg-[#F9F6F0] border rounded flex items-center gap-3"><div class="flex-1"><b>${esc(formatMonthRange(x.start,x.end))}</b><div>${esc(x.name)}</div></div><button onclick="deleteTravel('${x.id}')" class="text-red-600">刪除</button></div>`).join(''):'<div class="opacity-60">目前尚未新增旅途。</div>'}async function addTravel(){const start=$('travel-start').value,end=$('travel-end').value,name=$('travel-name').value.trim();if(!start||!end||!name)return alert('請完整填寫開始年月、結束年月及行程名稱');if(start>end)return alert('開始年月不可晚於結束年月');travel.push({id:String(Date.now()),start,end,name});await saveSettings({travel_entries:travel});$('travel-start').value=$('travel-end').value=$('travel-name').value='';renderTravelAdmin()}async function deleteTravel(id){if(!confirm('確定刪除這筆旅途？'))return;travel=travel.filter(x=>String(x.id)!==String(id));await saveSettings({travel_entries:travel});renderTravelAdmin()}
function populateParentSelects(){['new','edit'].forEach(t=>{$(t+'-article-parent-select').innerHTML='<option value="">請選擇母分類</option>'+sortedCats(categories).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');$(t+'-article-child-select').innerHTML='<option value="">(不選子分類)</option>'})}function updateChildren(t,sel=''){const p=catByName($(t+'-article-parent-select').value),ch=p?sortedCats(categories,p.id):[];$(t+'-article-child-select').innerHTML='<option value="">(不選子分類)</option>'+ch.map(x=>`<option ${x.name===sel?'selected':''}>${esc(x.name)}</option>`).join('')}function articleTab(n){$('article-new').classList.toggle('hidden',n!=='new');$('article-manage').classList.toggle('hidden',n!=='manage');if(n==='manage')loadArticleAdmin()}async function slugExists(slug,exclude){let q=db.from('articles').select('id').ilike('slug',slug).limit(1);if(exclude)q=q.neq('id',exclude);const{data,error}=await q;if(error)throw error;return!!data?.length}async function publishArticle(){const title=$('new-article-title').value.trim(),category=$('new-article-parent-select').value,subcategory=$('new-article-child-select').value,content=ed('new').innerHTML.trim(),slug=norm($('new-article-slug').value)||'article-'+Date.now();if(!title||!category)return alert('請輸入標題並選擇母分類');if(await slugExists(slug))return alert('網址後綴已被使用');const now=new Date().toISOString(),{error}=await db.from('articles').insert([{title,category,subcategory,content,slug,created_at:now,updated_at:now}]);if(error)return alert(error.message);await loadArticles();alert('發布成功');loadArticleAdmin()}function loadArticleAdmin(){$('admin-articles-list').innerHTML=articles.map(a=>`<div class="p-3 bg-[#F9F6F0] border rounded flex justify-between"><b>${esc(a.title)}</b><div><button onclick="editArticle('${a.id}')" class="bg-[#C9B59C] text-white px-3 py-1 rounded">修改</button> <button onclick="deleteArticle('${a.id}')" class="bg-red-500 text-white px-3 py-1 rounded">刪除</button></div></div>`).join('')}function editArticle(id){const a=articles.find(x=>String(x.id)===String(id));$('edit-article-id').value=a.id;$('edit-article-title').value=a.title;$('edit-article-slug').value=a.slug||'';ed('edit').innerHTML=a.content||'';$('edit-article-parent-select').value=a.category||'';updateChildren('edit',a.subcategory||'');$('edit-article-form').classList.remove('hidden')}async function updateArticle(){const id=$('edit-article-id').value,title=$('edit-article-title').value.trim(),category=$('edit-article-parent-select').value,subcategory=$('edit-article-child-select').value,content=ed('edit').innerHTML.trim(),slug=norm($('edit-article-slug').value)||'article-'+Date.now();if(!title||!category)return alert('資料不完整');if(await slugExists(slug,id))return alert('網址後綴已被使用');const{error}=await db.from('articles').update({title,category,subcategory,content,slug,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadArticles();$('edit-article-form').classList.add('hidden');loadArticleAdmin();alert('更新成功')}async function deleteArticle(id){if(!confirm('確定刪除？'))return;const{error}=await db.from('articles').delete().eq('id',id);if(error)return alert(error.message);await loadArticles();loadArticleAdmin()}
</script></body></html>
