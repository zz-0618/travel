<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zz 的旅遊部落格</title>
    <!-- 引入思源宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"Noto Serif TC"', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Noto Serif TC', serif; 
            background-color: #ffffff; 
            color: #452829; 
        }
        .custom-card {
            background-color: #EFE9E3;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .editor-btn {
            background-color: #EFE9E3;
            border: 1px solid #C9B59C;
            padding: 4px 8px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }
        .editor-btn:hover { opacity: 0.8; }
        /* 下拉選單懸浮子標籤樣式 */
        .dropdown-parent:hover .dropdown-child {
            display: block;
        }
        /* 內文與各階層標題強制統一使用思源宋體與相同顏色 */
        .article-content-style, 
        .article-content-style p, 
        .article-content-style span, 
        .article-content-style div,
        .article-content-style h1,
        .article-content-style h2,
        .article-content-style h3,
        .article-content-style h4 {
            font-family: 'Noto Serif TC', serif !important;
            color: #452829 !important;
        }
        /* 段落階層標題樣式支援 */
        .article-content-style h1 { font-size: 2.25rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; line-height: 1.2; }
        .article-content-style h2 { font-size: 1.875rem; font-weight: bold; margin-top: 0.875rem; margin-bottom: 0.5rem; line-height: 1.3; }
        .article-content-style h3 { font-size: 1.5rem; font-weight: bold; margin-top: 0.75rem; margin-bottom: 0.4rem; line-height: 1.4; }
        .article-content-style h4 { font-size: 1.25rem; font-weight: bold; margin-top: 0.5rem; margin-bottom: 0.3rem; line-height: 1.4; }
        .article-content-style p { margin-bottom: 0.75rem; }

        /* 內文自訂元素樣式 */
        .article-alert-box {
            background-color: #F2EAE0;
            border: 1px solid #C9B59C;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            font-family: 'Noto Serif TC', serif;
            color: #452829;
        }
        .article-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-family: 'Noto Serif TC', serif;
            color: #452829;
        }
        .article-table th, .article-table td {
            border: 1px solid #C9B59C;
            padding: 8px 12px;
            text-align: left;
        }
        .article-table th {
            background-color: #EFE9E3;
        }
        .article-details {
            border: 1px solid #C9B59C;
            border-radius: 8px;
            background-color: #F9F6F0;
            margin: 16px 0;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            color: #452829;
        }
        .article-summary {
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: #EFE9E3;
            user-select: none;
        }
        .article-details-content {
            padding: 14px;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 前台畫面 -->
    <div id="frontend-view">
        <header class="w-full py-6 bg-white shadow-sm border-b border-[#EFE9E3] flex flex-col items-center justify-center">
            <img id="site-logo" src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo" class="h-12 object-contain">
        </header>

        <nav style="background-color: #C9B59C;" class="text-white shadow-md relative z-30">
            <ul id="frontend-nav-tabs" class="flex justify-center flex-wrap space-x-6 py-3 text-lg font-semibold">
                <li><a href="#" onclick="filterCategory('all')" class="hover:opacity-85 transition">首頁</a></li>
            </ul>
        </nav>

        <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-4 gap-8">

            <aside class="space-y-6">

    <!-- 後台管理畫面 -->

                        <h3 class="text-lg font-semibold">發布新文章</h3>
                        <div>
                            <label class="block text-sm mb-1 font-semibold">文章標題</label>
                            <input type="text" id="new-article-title" class="w-full border p-2 rounded text-sm" placeholder="請輸入標題...">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm mb-1 font-semibold">母標籤 (必選)</label>

                                <select id="new-article-child-select" class="w-full border p-2 rounded text-sm bg-white">
                                    <option value="">請先選擇母標籤</option>

                            </div>

                                <button type="button" class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
                                <button type="button" class="editor-btn" onclick="insertLink()">🔗 超連結</button>

                                <button type="button" class="editor-btn" onclick="openTableModal('new')">📊 表格</button>
                                <button type="button" class="editor-btn" onclick="insertDetailsBlock('new')">📂 收放列表</button>
                                
                                <select class="editor-btn font-semibold" onchange="formatParagraphStyle(this.value); this.value='';">
                                    <option value="">段落階層</option>
                                    <option value="h1">第一階標題</option>
                                    <option value="h2">第二階標題</option>
                                    <option value="h3">第三階標題</option>
                                    <option value="h4">第四階標題</option>

                    </div>

                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-md text-[#452829]" id="edit-form-heading">編輯文章</h4>
                                <button onclick="closeEditForm()" class="text-xs text-gray-500 hover:underline">取消編輯</button>
                            </div>
                            <input type="hidden" id="edit-article-id">
                            <div>
                                <label class="block text-sm mb-1 font-semibold">文章標題</label>
                                <input type="text" id="edit-article-title" class="w-full border p-2 rounded text-sm">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm mb-1 font-semibold">母標籤 (必選)</label>
                                    <select id="edit-article-parent-select" class="w-full border p-2 rounded text-sm bg-white" onchange="updateChildDropdown('edit')">
                                        <option value="">請選擇母標籤...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm mb-1 font-semibold">子標籤 (選填)</label>
                                    <select id="edit-article-child-select" class="w-full border p-2 rounded text-sm bg-white">
                                        <option value="">請先選擇母標籤</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm mb-1 font-semibold">內文編輯器 (支援貼上圖片或檔案上傳)</label>
                                <div class="flex flex-wrap gap-2 mb-2 p-2 bg-[#F9F6F0] border rounded items-center">
                                    <button type="button" class="editor-btn" onclick="formatTextEdit('bold')"><b>B</b></button>
                                    <button type="button" class="editor-btn" onclick="formatTextEdit('italic')"><i>I</i></button>
                                    <button type="button" class="editor-btn" onclick="formatTextEdit('underline')"><u>U</u></button>
                                    <button type="button" class="editor-btn" onclick="insertLinkEdit()">🔗 超連結</button>
                                    <button type="button" class="editor-btn" onclick="triggerImageUpload('edit')">🖼️ 插入圖片</button>
                                    <input type="file" id="edit-image-file-input" class="hidden" accept="image/*" onchange="handleImageFileSelect(event, 'edit')">
                                    <button type="button" class="editor-btn" onclick="insertAlertBox('edit')">💡 提醒框</button>
                                    <button type="button" class="editor-btn" onclick="openTableModal('edit')">📊 表格</button>
                                    <button type="button" class="editor-btn" onclick="insertDetailsBlock('edit')">📂 收放列表</button>
                                    
                                    <select class="editor-btn font-semibold" onchange="formatParagraphStyleEdit(this.value); this.value='';">
                                        <option value="">段落階層</option>
                                        <option value="h1">第一階標題</option>
                                        <option value="h2">第二階標題</option>
                                        <option value="h3">第三階標題</option>
                                        <option value="h4">第四階標題</option>
                                        <option value="p">一般內文</option>
                                    </select>
                                </div>
                                <div id="edit-article-editor" contenteditable="true" class="w-full h-72 border p-3 rounded bg-white overflow-y-auto text-sm leading-relaxed article-content-style" onkeydown="handleEditorKeyDown(event)" onpaste="handleEditorPaste(event)"></div>
                            </div>
                            <div class="flex justify-end pt-2">
                                <button onclick="updateExistingArticle()" class="text-white px-6 py-2 rounded-lg font-medium hover:opacity-90" style="background-color: #C9B59C;">提交修改</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 表格設定 Modal -->
    <div id="table-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-[#452829]">插入自訂表格</h3>
            <input type="hidden" id="table-target-editor">
            <div>
                <label class="block text-xs mb-1 font-semibold">橫欄數 (Rows)</label>

            <div>

                <button onclick="confirmInsertTable()" class="px-4 py-2 text-white rounded text-sm" style="background-color: #C9B59C;">確認插入</button>

    <!-- 刪除確認 Modal -->
    <div id="delete-confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl text-center">

                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm hover:opacity-80">取消</button>
                <button onclick="confirmDeleteArticle()" class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm hover:opacity-80">確認刪除</button>
            </div>
        </div>

    <!-- 登入 Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-center">後台管理者登入</h3>
            <div>
                <label class="block text-xs mb-1">管理員信箱</label>
                <input type="email" id="admin-email-input" class="w-full text-sm border p-2 rounded" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs mb-1">密碼</label>
                <input type="password" id="admin-password-input" class="w-full text-sm border p-2 rounded" placeholder="••••••••">
            </div>
            <button onclick="loginWithEmail()" class="w-full text-white py-2 rounded-lg text-sm font-medium hover:opacity-90" style="background-color: #C9B59C;">登入後台</button>
            <div class="text-center">
                <button onclick="closeLoginModal()" class="text-xs text-gray-400 hover:text-gray-600">取消</button>
            </div>
        </div>
    </div>

    <!-- 右下角懸浮管理按鈕 -->
    <button id="floating-admin-btn" onclick="openAdminPanel()" class="fixed bottom-6 right-6 text-white px-4 py-3 rounded-full shadow-lg hover:opacity-95 transition z-40 flex items-center space-x-2 text-sm font-semibold pointer-events-auto" style="background-color: #C9B59C;" title="管理員登入">
        <span>⚙️</span>
        <span id="floating-btn-text">管理員登入</span>
    </button>

    <!-- 頁尾 -->
    <footer class="w-full py-4 text-center text-xs border-t border-[#EFE9E3] bg-white mt-12 opacity-80">
        @zz 轉載請註明出處
    </footer>

    <!-- Supabase 與互動邏輯 -->
    <script>
        const SUPABASE_URL = 'https://rpzqioezweftrjtrneos.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__8VdnjBQYgeFtPdArs4lww_4RJxrDye';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allArticlesCache = []; 
        let categoriesCache = []; 

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchCategories();
            await fetchArticles();
            loadSettings();
            checkSessionState();
        });

        async function checkSessionState() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const btnText = document.getElementById('floating-btn-text');
            if (session) {
                btnText.innerText = '管理後台';
            } else {
                btnText.innerText = '管理員登入';
            }
        }

        async function openAdminPanel() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                document.getElementById('login-modal').classList.remove('hidden');
            } else {
                switchView('admin');
            }
        }

        async function loginWithEmail() {
            const email = document.getElementById('admin-email-input').value;
            const password = document.getElementById('admin-password-input').value;
            if (!email || !password) return alert('請輸入帳號與密碼');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('登入失敗：' + error.message);
            } else {
                alert('登入成功！');
                closeLoginModal();
                checkSessionState();
                switchView('admin');
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            alert('已登出');
            checkSessionState();
            switchView('frontend');
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function switchView(view) {
            if (view === 'admin') {
                document.getElementById('frontend-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                loadCategoriesAdmin();
                loadManageArticlesList();
            } else {
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('frontend-view').classList.remove('hidden');
                fetchCategories().then(() => fetchArticles());
                loadSettings();
            }
        }

        function switchAdminTab(tabName) {
            ['avatar', 'logo', 'categories', 'articles'].forEach(t => {
                document.getElementById(`admin-tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).classList.remove('bg-[#C9B59C]', 'text-white');
                document.getElementById(`tab-${t}-btn`).classList.add('hover:bg-[#EFE9E3]');
            });
            document.getElementById(`admin-tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}-btn`).classList.add('bg-[#C9B59C]', 'text-white');
            document.getElementById(`tab-${tabName}-btn`).classList.remove('hover:bg-[#EFE9E3]');

            if (tabName === 'categories') loadCategoriesAdmin();
            if (tabName === 'articles') populateArticleParentDropdowns();
        }

        function switchArticleSubTab(sub) {
            if (sub === 'new') {
                document.getElementById('sub-article-new').classList.remove('hidden');
                document.getElementById('sub-article-manage').classList.add('hidden');
                document.getElementById('subtab-new-btn').classList.add('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-new-btn').classList.remove('bg-[#EFE9E3]');
                document.getElementById('subtab-manage-btn').classList.remove('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-manage-btn').classList.add('bg-[#EFE9E3]');
            } else {
                document.getElementById('sub-article-manage').classList.remove('hidden');
                document.getElementById('sub-article-new').classList.add('hidden');
                document.getElementById('subtab-manage-btn').classList.add('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-manage-btn').classList.remove('bg-[#EFE9E3]');
                document.getElementById('subtab-new-btn').classList.remove('bg-[#C9B59C]', 'text-white');
                document.getElementById('subtab-new-btn').classList.add('bg-[#EFE9E3]');
                loadManageArticlesList();
            }
        }

        // ================= 編輯器進階工具 =================
        function formatText(command) { document.execCommand(command, false, null); }
        function formatTextEdit(command) { document.execCommand(command, false, null); }
        function insertLink() {
            const url = prompt('請輸入超連結網址 (URL):');
            if (url) document.execCommand('createLink', false, url);
        }
        function insertLinkEdit() {
            const url = prompt('請輸入超連結網址 (URL):');
            if (url) document.execCommand('createLink', false, url);
        }

        function formatParagraphStyle(tag) {
            if (!tag) return;
            const editor = document.getElementById('new-article-editor');
            editor.focus();
            document.execCommand('formatBlock', false, `<${tag}>`);
        }

        function formatParagraphStyleEdit(tag) {
            if (!tag) return;
            const editor = document.getElementById('edit-article-editor');
            editor.focus();
            document.execCommand('formatBlock', false, `<${tag}>`);
        }

        function triggerImageUpload(type) {
            document.getElementById(`${type}-image-file-input`).click();
        }

        async function handleImageFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            await uploadAndInsertImage(file, type);
            event.target.value = '';
        }

        async function handleEditorPaste(event) {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    event.preventDefault();
                    const file = item.getAsFile();
                    const type = event.target.id.includes('new') ? 'new' : 'edit';
                    await uploadAndInsertImage(file, type);
                    break;
                }
            }
        }

        async function uploadAndInsertImage(file, type) {
            const { data, error } = await supabaseClient.storage.from('blog-assets').upload(`article_${Date.now()}_${file.name}`, file);
            if (error) {
                alert('圖片上傳失敗：' + error.message);
                return;
            }
            const publicUrl = supabaseClient.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;
            
            const editorId = `${type}-article-editor`;
            const editor = document.getElementById(editorId);
            editor.focus();
            
            const imgHtml = `<p><img src="${publicUrl}" class="max-w-full rounded my-3" style="max-height: 500px; object-fit: contain;" alt="文章圖片"></p><p><br></p>`;
            document.execCommand('insertHTML', false, imgHtml);
        }

        function insertAlertBox(type) {
            const editor = document.getElementById(`${type}-article-editor`);
            editor.focus();
            const alertHtml = `<div class="article-alert-box" contenteditable="true"><p>請在此輸入提醒框內文...</p></div><p><br></p>`;
            document.execCommand('insertHTML', false, alertHtml);
        }

        function openTableModal(type) {
            document.getElementById('table-target-editor').value = type;
            document.getElementById('table-modal').classList.remove('hidden');
        }

        function closeTableModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        function confirmInsertTable() {
            const type = document.getElementById('table-target-editor').value;
            const rows = parseInt(document.getElementById('table-rows-input').value) || 3;
            const cols = parseInt(document.getElementById('table-cols-input').value) || 3;
            closeTableModal();

            let tableHtml = `<table class="article-table"><thead><tr>`;
            for (let c = 0; c < cols; c++) {
                tableHtml += `<th>標題 ${c+1}</th>`;
            }
            tableHtml += `</tr></thead><tbody>`;
            for (let r = 0; r < rows - 1; r++) {
                tableHtml += `<tr>`;
                for (let c = 0; c < cols; c++) {
                    tableHtml += `<td>內容</td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</tbody></table><p><br></p>`;

            const editor = document.getElementById(`${type}-article-editor`);
            editor.focus();
            document.execCommand('insertHTML', false, tableHtml);
        }

        function insertDetailsBlock(type) {
            const editor = document.getElementById(`${type}-article-editor`);
            editor.focus();
            const detailsHtml = `
                <details class="article-details">
                    <summary class="article-summary">> 點擊展開查看內容</summary>
                    <div class="article-details-content" contenteditable="true">
                        <p>這裡是可以隱藏或顯示的剩餘內容...</p>
                    </div>
                </details>
                <p><br></p>
            `;
            document.execCommand('insertHTML', false, detailsHtml);
        }

        function handleEditorKeyDown(event) {
            if (event.key === 'Enter') {
                setTimeout(() => {
                    document.execCommand('formatBlock', false, 'p');
                }, 10);
            }
        }

        // ================= 分類管理與前台導覽列 =================
        async function fetchCategories() {
            const { data, error } = await supabaseClient.from('categories').select('*');
            if (error || !data) {
                categoriesCache = [];
            } else {
                categoriesCache = data;
            }
            renderFrontendNav();
        }

        function renderFrontendNav() {
            const navUl = document.getElementById('frontend-nav-tabs');
            const parents = categoriesCache.filter(c => !c.parent_id);

            let html = `<li><a href="#" onclick="filterCategory('all')" class="hover:opacity-85 transition block py-1">首頁</a></li>`;

            parents.forEach(parent => {
                const children = categoriesCache.filter(c => c.parent_id === parent.id);
                if (children.length > 0) {
                    html += `
                        <li class="relative dropdown-parent">
                            <a href="#" onclick="filterCategory('${parent.name}')" class="hover:opacity-85 transition block py-1">${parent.name} ▾</a>
                            <ul class="dropdown-child hidden absolute left-0 top-full bg-[#C9B59C] shadow-lg rounded-b py-2 min-w-[140px] space-y-1 z-45">
                                ${children.map(child => `<li><a href="#" onclick="filterCategory('${child.name}')" class="block px-4 py-1 hover:bg-black hover:bg-opacity-10 text-sm">${child.name}</a></li>`).join('')}
                            </ul>
                        </li>
                    `;
                } else {
                    html += `<li><a href="#" onclick="filterCategory('${parent.name}')" class="hover:opacity-85 transition block py-1">${parent.name}</a></li>`;
                }
            });

            navUl.innerHTML = html;
        }

        async function loadCategoriesAdmin() {
            await fetchCategories();
            const treeContainer = document.getElementById('admin-categories-tree');
            const parentSelect = document.getElementById('new-cat-parent');

            parentSelect.innerHTML = `<option value="">無 (設為獨立母分類)</option>` + 
                categoriesCache.filter(c => !c.parent_id).map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const parents = categoriesCache.filter(c => !c.parent_id);
            if (parents.length === 0) {
                treeContainer.innerHTML = `<p class="text-sm opacity-75">目前尚無分類。</p>`;
                return;
            }

            treeContainer.innerHTML = parents.map(parent => {
                const children = categoriesCache.filter(c => c.parent_id === parent.id);
                return `
                    <div class="space-y-1 pb-2 border-b border-[#EFE9E3] last:border-b-0">
                        <div class="flex justify-between items-center font-bold text-[#452829]">
                            <span>📁 ${parent.name}</span>
                            <button onclick="deleteCategory('${parent.id}')" class="text-xs bg-red-500 text-white px-2.5 py-1 rounded hover:opacity-80">刪除母分類</button>
                        </div>
                        <div class="pl-6 space-y-1 mt-1">
                            ${children.length === 0 ? `<div class="text-xs opacity-60">無子標籤</div>` : children.map(child => `
                                <div class="flex justify-between items-center text-sm py-1">
                                    <span>└ ${child.name}</span>
                                    <button onclick="deleteCategory('${child.id}')" class="text-xs bg-red-500 text-white px-2 py-0.5 rounded hover:opacity-80">刪除子分類</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function addNewCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            const parent_idVal = document.getElementById('new-cat-parent').value;
            const parent_id = parent_idVal === "" ? null : parent_idVal;
            
            if (!name) return alert('請輸入分類名稱');

            const payload = { name };
            if (parent_id) payload.parent_id = parent_id;

            const { error } = await supabaseClient.from('categories').insert([payload]);
            if (error) {
                alert('新增分類失敗：' + error.message);
            } else {
                alert('新增分類成功！');
                document.getElementById('new-cat-name').value = '';
                loadCategoriesAdmin();
            }
        }

        async function deleteCategory(id) {
            if (!confirm('確定要刪除此分類嗎？')) return;
            const { error } = await supabaseClient.from('categories').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('分類已刪除');
                loadCategoriesAdmin();
            }
        }

        function populateArticleParentDropdowns() {
            ['new', 'edit'].forEach(type => {
                const parentSelect = document.getElementById(`${type}-article-parent-select`);
                const parents = categoriesCache.filter(c => !c.parent_id);
                parentSelect.innerHTML = `<option value="">請選擇母標籤...</option>` + 
                    parents.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
                
                document.getElementById(`${type}-article-child-select`).innerHTML = `<option value="">請先選擇母標籤</option>`;
            });
        }

        function updateChildDropdown(type, selectedChildName = '') {
            const parentName = document.getElementById(`${type}-article-parent-select`).value;
            const childSelect = document.getElementById(`${type}-article-child-select`);

            if (!parentName) {
                childSelect.innerHTML = `<option value="">請先選擇母標籤</option>`;
                return;
            }

            const parentObj = categoriesCache.find(c => c.name === parentName && !c.parent_id);
            if (!parentObj) {
                childSelect.innerHTML = `<option value="">無子標籤</option>`;
                return;
            }

            const children = categoriesCache.filter(c => c.parent_id === parentObj.id);
            if (children.length === 0) {
                childSelect.innerHTML = `<option value="">此母標籤無子標籤</option>`;
            } else {
                childSelect.innerHTML = `<option value="">(不選子標籤)</option>` + 
                    children.map(ch => `<option value="${ch.name}" ${ch.name === selectedChildName ? 'selected' : ''}>${ch.name}</option>`).join('');
            }
        }

        // ================= 文章取得與列表 =================
        async function fetchArticles(category = 'all') {
            const container = document.getElementById('main-content-area');
            const { data, error } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false });
            
            if (error || !data || data.length === 0) {
                container.innerHTML = `<div class="custom-card p-6 rounded-xl border border-[#EFE9E3] shadow-sm">目前尚無文章。</div>`;
                return;
            }

            let filteredData = data;
            if (category !== 'all') {
                const targetCat = categoriesCache.find(c => c.name === category);
                if (targetCat && !targetCat.parent_id) {
                    const childIds = categoriesCache.filter(c => c.parent_id === targetCat.id).map(c => c.name);
                    const validCategories = [targetCat.name, ...childIds];
                    filteredData = data.filter(art => validCategories.includes(art.category));
                } else {
                    filteredData = data.filter(art => art.category === category || art.subcategory === category);
                }
            }

            allArticlesCache = data;

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="custom-card p-6 rounded-xl border border-[#EFE9E3] shadow-sm">此分類目前尚無文章。</div>`;
                return;
            }

            container.innerHTML = filteredData.map(article => `
                <article class="custom-card p-6 rounded-xl shadow-sm border border-[#EFE9E3] flex flex-col justify-between">
                    <div>
                        <div class="text-xs uppercase tracking-wider opacity-70 space-x-1">
                            <span class="cursor-pointer hover:underline" onclick="filterCategory('${article.category}')">${article.category}</span>
                            ${article.subcategory ? `<span>/</span> <span class="cursor-pointer hover:underline" onclick="filterCategory('${article.subcategory}')">${article.subcategory}</span>` : ''}
                        </div>
                        <h2 class="text-2xl font-bold mt-1 mb-3 cursor-pointer hover:underline" onclick="viewSingleArticle('${article.id}')" style="color: #452829;">${article.title}</h2>
                        <div class="line-clamp-2 leading-relaxed space-y-2 text-sm article-content-style">${article.content}</div>
                    </div>
                    <div class="flex justify-end mt-4">
                        <button onclick="viewSingleArticle('${article.id}')" class="text-sm font-semibold hover:opacity-75 transition" style="color: #452829;">
                            ...查看更多
                        </button>
                    </div>
                </article>
            `).join('');

            document.getElementById('table-of-contents').innerHTML = `<li><span class="opacity-75">點擊文章查看目錄</span></li>`;
        }

        function viewSingleArticle(id) {
            const article = allArticlesCache.find(art => art.id == id);
            if (!article) return;

            const container = document.getElementById('main-content-area');
            container.innerHTML = `
                <div class="mb-4">
                    <button onclick="fetchArticles('all')" class="text-sm px-4 py-2 bg-[#EFE9E3] border border-[#C9B59C] rounded-lg hover:opacity-85 font-semibold">← 返回文章列表</button>
                </div>
                <article class="space-y-4">
                    <div class="text-xs uppercase tracking-wider opacity-70 space-x-1 font-semibold">
                        <span class="cursor-pointer hover:underline" onclick="filterCategory('${article.category}')">${article.category}</span>
                        ${article.subcategory ? `<span>/</span> <span class="cursor-pointer hover:underline" onclick="filterCategory('${article.subcategory}')">${article.subcategory}</span>` : ''}
                    </div>
                    <h2 class="text-3xl font-bold" style="color: #452829;">${article.title}</h2>
                    <div id="article-body-content" class="leading-relaxed space-y-4 text-base pt-2 article-content-style">${article.content}</div>
                </article>
            `;

            generateArticleTOC();
        }

        function filterCategory(cat) { fetchArticles(cat); }

        function generateArticleTOC() {
            const body = document.getElementById('article-body-content');
            if (!body) return;
            const headings = body.querySelectorAll('h1, h2, h3, h4');
            const tocContainer = document.getElementById('table-of-contents');

            if (headings.length === 0) {
                tocContainer.innerHTML = `<li><span class="opacity-75">此文章無段落標題</span></li>`;
                return;
            }

            tocContainer.innerHTML = Array.from(headings).map((h, index) => {
                const tag = h.tagName.toLowerCase();
                let indent = 'pl-0';
                if (tag === 'h2') indent = 'pl-3';
                if (tag === 'h3') indent = 'pl-6';
                if (tag === 'h4') indent = 'pl-9';

                if (!h.id) h.id = `heading-${index}`;

                return `<li class="${indent}"><a href="#${h.id}" class="hover:opacity-80 transition block truncate">• ${h.innerText}</a></li>`;
            }).join('');
        }

        async function loadSettings() {
            const { data } = await supabaseClient.from('settings').select('*');
            if (data) {
                data.forEach(item => {
                    if (item.key === 'logo') document.getElementById('site-logo').src = item.value;
                    if (item.key === 'avatar') document.getElementById('site-avatar').src = item.value;
                });
            }
        }

        async function uploadAsset(type) {
            const fileInput = document.getElementById(`admin-${type}-file`);
            if (fileInput.files.length === 0) return alert('請先選擇檔案');
            const file = fileInput.files[0];
            
            const { data, error } = await supabaseClient.storage.from('blog-assets').upload(`${type}_${Date.now()}`, file);
            if (error) return alert('上傳失敗：' + error.message);

            const publicUrl = supabaseClient.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;
            
            const { error: upsertError } = await supabaseClient.from('settings').upsert({ key: type, value: publicUrl });
            if (upsertError) {
                alert('儲存設定失敗：' + upsertError.message);
                return;
            }

            alert('上傳並更新成功！');
            fileInput.value = '';
            
            // 立即重新載入設定，更新前端畫面
            loadSettings();
        }

        async function publishNewArticle() {
            const title = document.getElementById('new-article-title').value.trim();
            const category = document.getElementById('new-article-parent-select').value;
            const subcategory = document.getElementById('new-article-child-select').value;
            const content = document.getElementById('new-article-editor').innerHTML.trim();

            if (!title) return alert('請輸入文章標題');
            if (!category) return alert('母標籤為必選項目');

            const { error } = await supabaseClient.from('articles').insert([{ title, category, subcategory, content }]);
            if (error) {
                alert('發布失敗：' + error.message);
            } else {
                alert('發布成功！');
                document.getElementById('new-article-title').value = '';
                document.getElementById('new-article-editor').innerHTML = '';
                document.getElementById('new-article-parent-select').value = '';
                document.getElementById('new-article-child-select').innerHTML = `<option value="">請先選擇母標籤</option>`;
            }
        }

        async function loadManageArticlesList() {
            const listContainer = document.getElementById('admin-articles-list');
            const { data, error } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = `<p class="text-sm opacity-75">目前尚無文章可供維護。</p>`;
                return;
            }

            allArticlesCache = data;
            populateArticleParentDropdowns();

            listContainer.innerHTML = data.map(art => `
                <div class="p-3 bg-[#F9F6F0] border border-[#EFE9E3] rounded flex justify-between items-center">
                    <div>
                        <span class="text-xs opacity-70">[${art.category}${art.subcategory ? ' / ' + art.subcategory : ''}]</span>
                        <h4 class="font-bold text-sm" style="color: #452829;">${art.title}</h4>
                    </div>
                    <div class="space-x-2">
                        <button onclick="loadArticleToEdit('${art.id}')" class="text-xs bg-[#C9B59C] text-white px-3 py-1.5 rounded hover:opacity-80">修改</button>
                        <button onclick="openDeleteModal('${art.id}')" class="text-xs bg-red-500 text-white px-3 py-1.5 rounded hover:opacity-80">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        function loadArticleToEdit(id) {
            const article = allArticlesCache.find(art => art.id == id);
            if (!article) return;

            document.getElementById('edit-article-id').value = article.id;
            document.getElementById('edit-article-title').value = article.title;
            document.getElementById('edit-article-editor').innerHTML = article.content;
            
            document.getElementById('edit-article-parent-select').value = article.category || '';
            updateChildDropdown('edit', article.subcategory || '');

            document.getElementById('edit-form-heading').innerText = `編輯文章：${article.title}`;
            document.getElementById('edit-article-form').classList.remove('hidden');
        }

        function closeEditForm() {
            document.getElementById('edit-article-form').classList.add('hidden');
        }

        async function updateExistingArticle() {
            try {
                const id = document.getElementById('edit-article-id').value;
                const title = document.getElementById('edit-article-title').value.trim();
                const category = document.getElementById('edit-article-parent-select').value;
                const subcategory = document.getElementById('edit-article-child-select').value;
                const content = document.getElementById('edit-article-editor').innerHTML.trim();

                if (!title) return alert('請輸入文章標題');
                if (!category) return alert('母標籤為必選項目');

                const originalArticle = allArticlesCache.find(art => art.id == id);
                const created_at = originalArticle ? originalArticle.created_at : new Date().toISOString();

                const { error } = await supabaseClient.from('articles').upsert({ 
                    id: id, 
                    title, 
                    category, 
                    subcategory, 
                    content,
                    created_at 
                });

                if (error) {
                    alert('更新失敗：' + error.message);
                } else {
                    alert('文章更新成功！');
                    closeEditForm();
                    loadManageArticlesList();
                }
            } catch (err) {
                alert('連線失敗：請檢查你的網際網路連線或 Supabase 設定是否正確。');
                console.error(err);
            }
        }

        function openDeleteModal(id) {
            document.getElementById('delete-target-id').value = id;
            document.getElementById('delete-confirm-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('delete-confirm-modal').classList.add('hidden');
        }

        async function confirmDeleteArticle() {
            const id = document.getElementById('delete-target-id').value;
            if (!id) return;

            const { error } = await supabaseClient.from('articles').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('文章已成功刪除！');
                closeDeleteModal();
                loadManageArticlesList();
            }
        }
    </script>
</body>
</html>
