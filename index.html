async function checkSessionState(){const{data:{session}}=await supabaseClient.auth.getSession();document.getElementById('floating-btn-text').innerText=session?'管理後台':'管理員登入'}async function openAdminPanel(){const{data:{session}}=await supabaseClient.auth.getSession();session?switchView('admin'):document.getElementById('login-modal').classList.remove('hidden')}async function loginWithEmail(){const email=document.getElementById('admin-email-input').value,password=document.getElementById('admin-password-input').value;if(!email||!password)return alert('請輸入帳號與密碼');const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return alert('登入失敗：'+error.message);closeLoginModal();checkSessionState();switchView('admin')}async function logoutAdmin(){await supabaseClient.auth.signOut();checkSessionState();switchView('frontend')}function closeLoginModal(){document.getElementById('login-modal').classList.add('hidden')}

async function fetchCategories(){const{data}=await supabaseClient.from('categories').select('*');categoriesCache=data||[];renderFrontendNav()}function renderFrontendNav(){const p=categoriesCache.filter(c=>!c.parent_id);document.getElementById('frontend-nav-tabs').innerHTML='<li><a href="/" onclick="event.preventDefault();goHome()">首頁</a></li>'+p.map(x=>{const ch=categoriesCache.filter(c=>c.parent_id===x.id);return ch.length?`<li class="relative dropdown-parent"><a href="#" onclick="event.preventDefault();filterCategory('${jsq(x.name)}')">${esc(x.name)} ▾</a><ul class="dropdown-child hidden absolute bg-[#C9B59C] min-w-[140px] py-2">${ch.map(y=>`<li><a href="#" class="block px-4 py-1" onclick="event.preventDefault();filterCategory('${jsq(y.name)}')">${esc(y.name)}</a></li>`).join('')}</ul></li>`:`<li><a href="#" onclick="event.preventDefault();filterCategory('${jsq(x.name)}')">${esc(x.name)}</a></li>`}).join('')}
async function fetchArticles(cat='all'){const c=document.getElementById('main-content-area'),{data,error}=await supabaseClient.from('articles').select('*').order('created_at',{ascending:false});if(error)return c.innerHTML='<div class="custom-card p-6 rounded">讀取失敗：'+esc(error.message)+'</div>';allArticlesCache=data||[];let list=allArticlesCache;if(cat!=='all'){const target=categoriesCache.find(x=>x.name===cat);if(target&&!target.parent_id){const names=[target.name,...categoriesCache.filter(x=>x.parent_id===target.id).map(x=>x.name)];list=list.filter(a=>names.includes(a.category)||names.includes(a.subcategory))}else list=list.filter(a=>a.category===cat||a.subcategory===cat)}document.getElementById('sidebar-toc-container').classList.add('hidden');c.innerHTML=list.length?list.map(a=>`<article class="custom-card p-6 rounded-xl shadow-sm"><div class="text-xs opacity-70">${esc(a.category)}${a.subcategory?' / '+esc(a.subcategory):''}</div><h2 class="text-2xl font-bold mt-1"><a href="${articlePath(a)}" onclick="event.preventDefault();viewSingleArticle('${a.id}')" class="hover:underline">${esc(a.title)}</a></h2><div class="line-clamp-2 mt-3 article-content-style">${a.content||''}</div><div class="text-right mt-4"><a href="${articlePath(a)}" onclick="event.preventDefault();viewSingleArticle('${a.id}')" class="font-semibold">...查看更多</a></div></article>`).join(''):'<div class="custom-card p-6 rounded">目前尚無文章。</div>'}

async function handleCurrentRoute(){const path=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,'');if(!path||path==='index.html'){await fetchArticles();return}let a=allArticlesCache.find(x=>x.slug&&x.slug.toLowerCase()===path.toLowerCase());if(!a){const{data}=await supabaseClient.from('articles').select('*').ilike('slug',path).maybeSingle();a=data;if(a&&!allArticlesCache.some(x=>x.id==a.id))allArticlesCache.push(a)}a?viewSingleArticle(a.id,{updateHistory:false}):showNotFound()}function showNotFound(){document.title='找不到文章｜zz 的旅遊部落格';document.getElementById('sidebar-toc-container').classList.add('hidden');document.getElementById('main-content-area').innerHTML='<div class="custom-card p-8 rounded text-center"><h2 class="text-2xl font-bold">找不到這篇文章</h2><button onclick="goHome()" class="mt-5 px-4 py-2 text-white rounded bg-[#C9B59C]">返回首頁</button></div>'}function goHome(){if(location.pathname!=='/')history.pushState({page:'home'},'','/');document.title='zz 的旅遊部落格';fetchArticles()}function filterCategory(c){if(location.pathname!=='/')history.pushState({page:'category'},'','/');fetchArticles(c)}async function copyUrl(){try{await navigator.clipboard.writeText(location.href);alert('文章網址已複製！')}catch{prompt('請複製網址',location.href)}}function generateArticleTOC(){const hs=document.querySelectorAll('#article-body-content h1,#article-body-content h2,#article-body-content h3,#article-body-content h4'),toc=document.getElementById('table-of-contents');toc.innerHTML=hs.length?[...hs].map((h,i)=>{h.id=h.id||'heading-'+i;return`<li style="padding-left:${(Number(h.tagName[1])-1)*12}px"><a href="#${h.id}">• ${esc(h.innerText)}</a></li>`}).join(''):'<li>此文章無段落標題</li>'}
async function loadSettings(){const{data}=await supabaseClient.from('settings').select('*');(data||[]).forEach(x=>{if(x.key==='logo')document.getElementById('site-header-bg').style.backgroundImage=`url('${x.value}')`;if(x.key==='avatar')document.getElementById('site-avatar').src=x.value})}async function uploadAsset(t){const input=document.getElementById('admin-'+t+'-file'),file=input.files[0];if(!file)return alert('請先選擇檔案');const{data,error}=await supabaseClient.storage.from('blog-assets').upload(`${t}_${Date.now()}_${file.name}`,file);if(error)return alert(error.message);const url=supabaseClient.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;const{error:e}=await supabaseClient.from('settings').upsert({key:t,value:url});if(e)return alert(e.message);alert('更新成功');loadSettings()}
function populateArticleParentDropdowns(){['new','edit'].forEach(t=>{const p=categoriesCache.filter(c=>!c.parent_id);document.getElementById(t+'-article-parent-select').innerHTML='<option value="">請選擇母標籤</option>'+p.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');document.getElementById(t+'-article-child-select').innerHTML='<option value="">請先選擇母標籤</option>'})}function updateChildDropdown(t,selected=''){const n=document.getElementById(t+'-article-parent-select').value,p=categoriesCache.find(c=>c.name===n&&!c.parent_id),ch=p?categoriesCache.filter(c=>c.parent_id===p.id):[];document.getElementById(t+'-article-child-select').innerHTML='<option value="">(不選子標籤)</option>'+ch.map(x=>`<option value="${esc(x.name)}" ${x.name===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
async function loadCategoriesAdmin(){await fetchCategories();const p=categoriesCache.filter(c=>!c.parent_id);document.getElementById('new-cat-parent').innerHTML='<option value="">無（設為母分類）</option>'+p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');document.getElementById('admin-categories-tree').innerHTML=p.map(x=>`<div class="p-3 border rounded"><b>📁 ${esc(x.name)}</b><button onclick="deleteCategory('${x.id}')" class="float-right text-xs bg-red-500 text-white px-2 py-1 rounded">刪除</button><div class="pl-6 mt-2">${categoriesCache.filter(c=>c.parent_id===x.id).map(y=>`<div>└ ${esc(y.name)} <button onclick="deleteCategory('${y.id}')" class="text-xs text-red-600">刪除</button></div>`).join('')}</div></div>`).join('')}async function addNewCategory(){const name=document.getElementById('new-cat-name').value.trim(),parent_id=document.getElementById('new-cat-parent').value||null;if(!name)return alert('請輸入分類名稱');const{error}=await supabaseClient.from('categories').insert([{name,parent_id}]);if(error)return alert(error.message);document.getElementById('new-cat-name').value='';loadCategoriesAdmin()}async function deleteCategory(id){if(!confirm('確定刪除？'))return;const{error}=await supabaseClient.from('categories').delete().eq('id',id);if(error)return alert(error.message);loadCategoriesAdmin()}
async function slugExists(slug,excludeId=null){let q=supabaseClient.from('articles').select('id').ilike('slug',slug).limit(1);if(excludeId!==null)q=q.neq('id',excludeId);const{data,error}=await q;if(error)throw error;return!!data?.length}async function publishNewArticle(){const title=document.getElementById('new-article-title').value.trim(),category=document.getElementById('new-article-parent-select').value,subcategory=document.getElementById('new-article-child-select').value,content=document.getElementById('new-article-editor').innerHTML.trim(),slug=normalizeSlug(document.getElementById('new-article-slug').value)||fallbackSlug();if(!title||!category)return alert('請輸入標題並選擇母標籤');try{if(await slugExists(slug))return alert('網址後綴已被使用');const now=new Date().toISOString(),{data,error}=await supabaseClient.from('articles').insert([{title,category,subcategory,content,slug,created_at:now,updated_at:now}]).select().single();if(error)throw error;alert('發布成功！\n'+location.origin+'/'+data.slug);document.getElementById('new-article-title').value='';document.getElementById('new-article-slug').value='';document.getElementById('new-article-editor').innerHTML='';await fetchArticles()}catch(e){alert('發布失敗：'+e.message)}}
async function loadManageArticlesList(){const{data,error}=await supabaseClient.from('articles').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);allArticlesCache=data||[];populateArticleParentDropdowns();document.getElementById('admin-articles-list').innerHTML=allArticlesCache.map(a=>`<div class="p-3 bg-[#F9F6F0] border rounded flex justify-between"><div><b>${esc(a.title)}</b><div class="text-xs opacity-60">/${esc(a.slug||'尚未設定')}</div></div><div><button onclick="loadArticleToEdit('${a.id}')" class="text-xs bg-[#C9B59C] text-white px-3 py-1 rounded">修改</button> <button onclick="deleteArticle('${a.id}')" class="text-xs bg-red-500 text-white px-3 py-1 rounded">刪除</button></div></div>`).join('')}function loadArticleToEdit(id){const a=allArticlesCache.find(x=>x.id==id);if(!a)return;document.getElementById('edit-article-id').value=a.id;document.getElementById('edit-article-title').value=a.title;document.getElementById('edit-article-slug').value=a.slug||'';document.getElementById('edit-article-editor').innerHTML=a.content||'';document.getElementById('edit-article-parent-select').value=a.category||'';updateChildDropdown('edit',a.subcategory||'');document.getElementById('edit-article-form').classList.remove('hidden')}function closeEditForm(){document.getElementById('edit-article-form').classList.add('hidden')}
async function updateExistingArticle(){const id=document.getElementById('edit-article-id').value,title=document.getElementById('edit-article-title').value.trim(),category=document.getElementById('edit-article-parent-select').value,subcategory=document.getElementById('edit-article-child-select').value,content=document.getElementById('edit-article-editor').innerHTML.trim(),slug=normalizeSlug(document.getElementById('edit-article-slug').value)||fallbackSlug();if(!title||!category)return alert('請輸入標題並選擇母標籤');try{if(await slugExists(slug,id))return alert('網址後綴已被使用');const original=allArticlesCache.find(a=>a.id==id);if(!original)throw new Error('找不到原始文章資料，請重新整理後再試');const{data,error}=await supabaseClient.from('articles').upsert({id:original.id,title,category,subcategory,content,slug,created_at:original.created_at,updated_at:new Date().toISOString()},{onConflict:'id'}).select().single();if(error)throw error;alert('文章更新成功！\n'+location.origin+'/'+encodeURIComponent(data.slug));closeEditForm();await loadManageArticlesList()}catch(e){alert('更新失敗：'+e.message)}}async function deleteArticle(id){if(!confirm('確定刪除這篇文章？'))return;const{error}=await supabaseClient.from('articles').delete().eq('id',id);if(error)return alert(error.message);loadManageArticlesList()}
</script></body></html>
