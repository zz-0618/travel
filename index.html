<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zz 的旅遊部落格</title>
    <!-- 引入思源宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { 50: '#f5f3ff', 100: '#ede9fe', 600: '#7c3aed', 700: '#6d28d9', 900: '#4c1d95' }
                    },
                    fontFamily: { serif: ['"Noto Serif TC"', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #faf5ff; color: #3b0764; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div>
        <!-- Logo 區 -->
        <header class="w-full py-6 bg-white shadow-sm border-b border-purple-100 flex flex-col items-center justify-center">
            <img id="site-logo" src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo" class="h-12 object-contain mb-3">
            <div class="text-xs text-purple-400 cursor-pointer hover:underline" onclick="checkAdminAccess()">⚙️ 管理後台 / 上傳設定</div>
        </header>

        <!-- 索引頁籤 -->
        <nav class="bg-purple-900 text-purple-100 shadow-md">
            <ul class="flex justify-center space-x-8 py-3 text-lg font-semibold">
                <li><a href="#" onclick="filterCategory('all')" class="hover:text-white transition">首頁</a></li>
                <li><a href="#" onclick="filterCategory('domestic')" class="hover:text-white transition">國內旅遊</a></li>
                <li><a href="#" onclick="filterCategory('china')" class="hover:text-white transition">中國旅遊</a></li>
                <li><a href="#" onclick="filterCategory('korea')" class="hover:text-white transition">韓國旅遊</a></li>
            </ul>
        </nav>

        <!-- 主體內容 -->
        <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-4 gap-8">
            <section class="md:col-span-3 space-y-6" id="article-container">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-purple-100">
                    <h2 class="text-2xl font-bold mb-2 text-purple-900">載入中...</h2>
                </div>
            </section>

            <aside class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-purple-100 text-center flex flex-col items-center">
                    <img id="site-avatar" src="https://via.placeholder.com/100?text=Avatar" alt="頭像" class="w-24 h-24 rounded-full object-cover mb-3 border-2 border-purple-300">
                    <h3 class="text-xl font-bold text-purple-900">zz</h3>
                    <p class="text-sm text-purple-600 mt-1">一個隨筆紀錄的人</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-purple-100 sticky top-4">
                    <h4 class="font-bold text-purple-900 border-b border-purple-100 pb-2 mb-3">📂 段落目錄</h4>
                    <ul id="table-of-contents" class="text-sm space-y-2 text-purple-700">
                        <li><a href="#" class="hover:underline"># 載入中...</a></li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <!-- 後台面板 -->
    <div id="admin-panel" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-lg w-full space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-purple-900">後台管理與上傳</h3>
                <div>
                    <button onclick="logoutAdmin()" class="text-xs text-red-500 hover:underline mr-3">登出</button>
                    <button onclick="toggleAdminPanel()" class="text-gray-500 hover:text-black">✕</button>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-1">變更 Logo</label>
                <input type="file" id="logo-file" class="w-full text-sm border p-2 rounded">
                <button onclick="uploadAsset('logo')" class="mt-2 bg-purple-600 text-white px-4 py-1 rounded text-sm hover:bg-purple-700">上傳並更新 Logo</button>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">變更頭像</label>
                <input type="file" id="avatar-file" class="w-full text-sm border p-2 rounded">
                <button onclick="uploadAsset('avatar')" class="mt-2 bg-purple-600 text-white px-4 py-1 rounded text-sm hover:bg-purple-700">上傳並更新頭像</button>
            </div>

            <div class="border-t pt-3">
                <label class="block text-sm font-semibold mb-1">發布新文章</label>
                <input type="text" id="new-title" placeholder="文章標題" class="w-full text-sm border p-2 rounded mb-2">
                <select id="new-category" class="w-full text-sm border p-2 rounded mb-2">
                    <option value="domestic">國內旅遊</option>
                    <option value="china">中國旅遊</option>
                    <option value="korea">韓國旅遊</option>
                </select>
                <textarea id="new-content" placeholder="文章內容 (支援 HTML)" class="w-full text-sm border p-2 rounded h-24 mb-2"></textarea>
                <button onclick="publishArticle()" class="bg-purple-900 text-white px-4 py-2 rounded text-sm hover:bg-purple-800 w-full">確認發布文章</button>
            </div>
        </div>
    </div>

    <!-- 密碼登入 Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-purple-900 text-center">後台管理者登入</h3>
            <div>
                <label class="block text-xs text-purple-700 mb-1">管理員信箱</label>
                <input type="email" id="admin-email-input" class="w-full text-sm border p-2 rounded" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs text-purple-700 mb-1">密碼</label>
                <input type="password" id="admin-password-input" class="w-full text-sm border p-2 rounded" placeholder="••••••••">
            </div>
            <button onclick="loginWithEmail()" class="w-full bg-purple-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-purple-800">登入後台</button>
            <div class="text-center">
                <button onclick="closeLoginModal()" class="text-xs text-gray-400 hover:text-gray-600">取消</button>
            </div>
        </div>
    </div>

    <footer class="w-full py-4 text-center text-xs text-purple-500 border-t border-purple-100 bg-white mt-12">
        @zz 轉載請註明出處
    </footer>

    <script>
        const SUPABASE_URL = 'https://rpzqioezweftrjtrneos.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__8VdnjBQYgeFtPdArs4lww_4RJxrDye';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            fetchArticles();
            loadSettings();
        });

        async function checkAdminAccess() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                document.getElementById('login-modal').classList.remove('hidden');
            } else {
                toggleAdminPanel();
            }
        }

        async function loginWithEmail() {
            const email = document.getElementById('admin-email-input').value;
            const password = document.getElementById('admin-password-input').value;

            if (!email || !password) return alert('請輸入帳號與密碼');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('登入失敗：' + error.message);
            } else {
                alert('登入成功！');
                closeLoginModal();
                toggleAdminPanel();
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            alert('已登出');
            location.reload();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function toggleAdminPanel() {
            document.getElementById('admin-panel').classList.toggle('hidden');
        }

        async function fetchArticles(category = 'all') {
            const container = document.getElementById('article-container');
            let query = supabaseClient.from('articles').select('*').order('created_at', { ascending: false });
            if (category !== 'all') query = query.eq('category', category);

            const { data, error } = await query;
            if (error || !data || data.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl border text-purple-700">目前尚無文章。</div>`;
                return;
            }

            container.innerHTML = data.map(article => `
                <article class="bg-white p-6 rounded-xl shadow-sm border border-purple-100">
                    <span class="text-xs text-purple-500 uppercase tracking-wider">${article.category}</span>
                    <h2 class="text-2xl font-bold mt-1 mb-3 text-purple-900">${article.title}</h2>
                    <div class="text-purple-800 leading-relaxed space-y-2">${article.content}</div>
                </article>
            `).join('');

            generateTOC(data);
        }

        function filterCategory(cat) { fetchArticles(cat); }

        function generateTOC(articles) {
            const tocContainer = document.getElementById('table-of-contents');
            tocContainer.innerHTML = articles.map(art => `
                <li><a href="#" class="hover:text-purple-900 transition block truncate">• ${art.title}</a></li>
            `).join('');
        }

        async function loadSettings() {
            const { data } = await supabaseClient.from('settings').select('*');
            if (data) {
                data.forEach(item => {
                    if (item.key === 'logo') document.getElementById('site-logo').src = item.value;
                    if (item.key === 'avatar') document.getElementById('site-avatar').src = item.value;
                });
            }
        }

        async function uploadAsset(type) {
            const fileInput = document.getElementById(`${type}-file`);
            if (fileInput.files.length === 0) return alert('請先選擇檔案');
            const file = fileInput.files[0];
            
            const { data, error } = await supabaseClient.storage.from('blog-assets').upload(`${type}_${Date.now()}`, file);
            if (error) return alert('上傳失敗：' + error.message);

            const publicUrl = supabaseClient.storage.from('blog-assets').getPublicUrl(data.path).data.publicUrl;
            await supabaseClient.from('settings').upsert({ key: type, value: publicUrl });
            alert('更新成功！');
            location.reload();
        }

        async function publishArticle() {
            const title = document.getElementById('new-title').value;
            const category = document.getElementById('new-category').value;
            const content = document.getElementById('new-content').value;

            if (!title || !content) return alert('標題與內容不得為空');

            const { error } = await supabaseClient.from('articles').insert([{ title, category, content }]);
            if (error) {
                alert('發布失敗：' + error.message);
            } else {
                alert('發布成功！');
                location.reload();
            }
        }
    </script>
</body>
</html>
