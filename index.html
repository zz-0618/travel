    <script>
      const SUPABASE_URL = "https://rpzqioezweftrjtrneos.supabase.co",
        SUPABASE_ANON_KEY = "sb_publishable__8VdnjBQYgeFtPdArs4lww_4RJxrDye";
      let supabaseClient;
      async function initSupabase(){
        if(supabaseClient) return supabaseClient;
        const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
        supabaseClient = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let allArticlesCache = [],

        journeyEntries = [],

      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          ),
        jsq = (s) =>
          String(s ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");

      function preloadImage(id, url, fetchPriority = "high") {
        const imageUrl = String(url || "").trim();
        let link = document.getElementById(id);

        if (!imageUrl) {
          link?.remove();
          return;
        }

        if (!link) {
          link = document.createElement("link");
          link.id = id;
          link.rel = "preload";
          link.as = "image";
          document.head.appendChild(link);
        }

        link.href = imageUrl;
        link.fetchPriority = fetchPriority;
      }

      function normalizeSlug(v) {
        return String(v || "")
          .trim()
          .replace(/^\/+|\/+$/g, "")
          .replace(/\s+/g, "-")
          .replace(/[^A-Za-z0-9_-]/g, "")
          .replace(/-+/g, "-");
      }
      function fallbackSlug() {
        return "article-" + Date.now();
      }
      function categoryByName(n) {
        return categoriesCache.find((c) => c.name === n);
      }
      function categorySlug(n) {
        const c = categoryByName(n);
        return normalizeSlug(c?.slug);
      }
      function safePath(parts) {
        const clean = parts.map(normalizeSlug).filter(Boolean);
        return clean.length
          ? "/" + clean.map(encodeURIComponent).join("/")
          : "/";
      }
      function categoryPath(n) {
        const c = categoryByName(n);
        if (!c) return "/";
        const parts = [];
        if (c.parent_id) {
          const parent = categoriesCache.find((x) => x.id === c.parent_id);
          parts.push(parent?.slug);
        }
        parts.push(c.slug);
        return safePath(parts);
      }
      function articlePath(a) {
        const parts = [categorySlug(a.category)];
        if (a.subcategory) parts.push(categorySlug(a.subcategory));
        parts.push(normalizeSlug(a.slug) || fallbackSlug());
        return safePath(parts);
      }

      function buildBreadcrumbSchema(article) {

        const items = [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "首頁",
            "item": "https://travel.aleafpath.workers.dev/"
          }
        ];
      
        let position = 2;
      
        if (article.category) {
      
          items.push({
            "@type": "ListItem",
            "position": position++,
            "name": article.category,
            "item":
              "https://travel.aleafpath.workers.dev" +
              categoryPath(article.category)
          });
      
        }
      
        if (article.subcategory) {
      
          items.push({
            "@type": "ListItem",
            "position": position++,
            "name": article.subcategory,
            "item":
              "https://travel.aleafpath.workers.dev" +
              categoryPath(article.subcategory)
          });
      
        }
      
        items.push({
          "@type": "ListItem",
          "position": position,
          "name": article.title,
          "item": location.href
        });
      
        return {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": items
        };
      }

      function buildFaqSchema(article) {

        const wrapper =
          document.createElement("div");
      
        wrapper.innerHTML =
          article.content || "";
      
        const faqItems = [
          ...wrapper.querySelectorAll(
            ".faq-item"
          )
        ];
      
        if (!faqItems.length) {
          return null;
        }
      
        const entities = [];
      
        faqItems.forEach(item => {
      
          const question =
            item.querySelector("summary")
              ?.textContent
              ?.trim();
      
          const answer =
            item.querySelector(".faq-answer")
              ?.textContent
              ?.trim();
      
          if (
            !question ||
            !answer
          ) return;
      
          entities.push({
      
            "@type": "Question",
      
            "name": question,
      
            "acceptedAnswer": {
      
              "@type": "Answer",
      
              "text": answer
      
            }
      
          });
      
        });
      
        if (!entities.length) {
          return null;
        }
      
        return {
      
          "@context":
            "https://schema.org",
      
          "@type":
            "FAQPage",
      
          "mainEntity":
            entities
      
        };
      
      }
      
      function updateStructuredData(article = null) {

        const script =
          document.getElementById(
            "structured-data"
          );
      
        if (!script) return;
      
        const siteName =
          settingsCache.nickname ||
          "一葉知途";
      
        const logo =
          settingsCache.logo ||
          settingsCache.avatar ||
          "";
      
        if (!article) {
      
          script.textContent =
            JSON.stringify({
              "@context":"https://schema.org",
      
              "@type":"WebSite",
      
              "name":"一葉知途",
      
              "alternateName":
                "A Leaf Path",
      
              "url":
                "https://travel.aleafpath.workers.dev",
      
              "publisher":{
                "@type":"Organization",
      
                "name":"一葉知途"
              }
            });
      
          return;
        }
      
        const box =
          document.createElement("div");
      
        box.innerHTML =
          article.content || "";
      
        const plainText =
          (box.textContent || "")
            .replace(/\s+/g," ")
            .trim();
      
        const description =
        (
          article.excerpt ||
          plainText
        )
        .trim()
        .substring(
          0,
          160
        );

      
        const socialImage =
          article.cover_image_url ||
          logo ||
          "";
      
        let tags = [];
      
        try {
      
          tags =
            JSON.parse(
              settingsCache[
                "article_tags_" +
                article.id
              ] || "[]"
            );
      
        } catch {}
      
        const blogPostingSchema = {
      
          "@context":
            "https://schema.org",
      
          "@type":
            "BlogPosting",
      
          "headline":
            article.title,
      
          "description":
            description,
      
          "image":
            socialImage
              ? [socialImage]
              : [],
      
          "datePublished":
            article.created_at,
      
          "dateModified":
            article.updated_at ||
            article.created_at,
      
          "mainEntityOfPage": {
            "@type":
              "WebPage",
      
            "@id":
              location.href
          },

            "articleBody":
              plainText.substring(
                0,
                5000
              ),
            
            "about": {
              "@type":"Thing",
              "name":
                article.category
            },
      
          "author": {
            "@type":
              "Person",
      
            "name":
              "一葉知途",
      
            "url":
              "https://travel.aleafpath.workers.dev/about"
          },
      
          "publisher": {
      
            "@type":
              "Organization",
      
            "name":
              siteName,
      
            "logo": {
      
              "@type":
                "ImageObject",
      
              "url":
                logo
            }
          },
      
          "articleSection":
            article.category,
      
          "keywords":
            tags,
      
          "inLanguage":
            "zh-TW"
      
        };
      
        const breadcrumbSchema =
          buildBreadcrumbSchema(
            article
          );
        
        const faqSchema =
          buildFaqSchema(
            article
          );
        
        const schemas = [
        
          blogPostingSchema,
        
          breadcrumbSchema
        
        ];
        
        if (faqSchema) {
        
          schemas.push(
            faqSchema
          );
        
        }
        
        script.textContent =
          JSON.stringify(
            schemas
          );
              }
      
      function safePushState(state, path) {
        const safe = String(path || "/");
        if (!safe.startsWith("/") || safe.startsWith("//"))
          throw new Error("網址路徑設定錯誤：" + safe);
        history.pushState(state, "", safe);
      }

      function articleStatusKey(id){return "article_status_"+String(id)}
      function articleTagsKey(id){return "article_tags_"+String(id)}
      function isPublishedArticle(a){return settingsCache[articleStatusKey(a.id)]!=="draft"}
      function getArticleTags(a){try{const v=JSON.parse(settingsCache[articleTagsKey(a.id)]||"[]");return Array.isArray(v)?v:[]}catch{return[]}}
      const ARTICLES_PER_PAGE = 10;
      let activeCategoryName="all",activeTagFilters=[],currentArticlePage=1;
      function toggleCategoryTag(tag){activeTagFilters=activeTagFilters.includes(tag)?activeTagFilters.filter(x=>x!==tag):[...activeTagFilters,tag];fetchArticles(activeCategoryName,{preserveTags:true,page:1})}
      function tagBar(cat,list){const c=categoryByName(cat);if(!c?.parent_id)return"";const tags=[...new Set(list.flatMap(getArticleTags))];return tags.length?`<div class="tag-filter-bar">${tags.map(t=>`<button class="tag-filter-button ${activeTagFilters.includes(t)?"active":""}" onclick="toggleCategoryTag('${jsq(t)}')">#${esc(t)}</button>`).join("")}</div>`:""}
      function renderArticlePagination(total,currentPage,cat){
        const pages=Math.ceil(total/ARTICLES_PER_PAGE);
        if(pages<=1)return"";
        const go=page=>`fetchArticles('${jsq(cat)}',{preserveTags:true,page:${page},scrollToList:true})`;
        const previous=currentPage>1?`<button type="button" class="article-pagination-nav article-pagination-prev" onclick="${go(currentPage-1)}">← 上一頁</button>`:`<span class="article-pagination-placeholder" aria-hidden="true"></span>`;
        const next=currentPage<pages?`<button type="button" class="article-pagination-nav article-pagination-next" onclick="${go(currentPage+1)}">下一頁 →</button>`:`<span class="article-pagination-placeholder" aria-hidden="true"></span>`;

              card.querySelector(".map-hours")
                ?.textContent
                ?.trim();

            const address =
              card.querySelector(".map-address")
                ?.textContent
                ?.trim();

            card.outerHTML =
            `
            <a
              class="map-preview-card"
              href="${url}"
              target="_blank"
              rel="noopener noreferrer">

              <div class="map-preview-platform">
                ${icon} ${platform}
              </div>

              <div class="map-preview-title">
                ${name}
              </div>

              ${
                hours
                ? `
                <div class="map-preview-hours">
                  🕒 ${hours}
                </div>
                `
                : ""
              }

              ${
                address
                ? `
                <div class="map-preview-desc">
                  ${address}
                </div>
                `
                : ""
              }

            </a>
            `;
          });
      }
      function scrollToArticleHeading(event,id){event.preventDefault();event.stopPropagation();const t=document.getElementById(id);if(!t)return;toggleTOC(false);requestAnimationFrame(()=>t.scrollIntoView({behavior:"smooth",block:"start"}))}
      function generateArticleTOC() {
      
          const body = $("article-body-content");
          if (!body) return;
      
          body.querySelector(".inline-article-toc")?.remove();
      
          const headings = [
              ...body.querySelectorAll("h3,h4")
          ];
      
          let h3Number = 0;
          let h4Number = 0;
      
          const entries = [];
      
          headings.forEach((heading,index)=>{
      
              heading.id =
                  heading.id || "heading-" + index;
      
              if (heading.tagName === "H3") {
      
                  h3Number++;
                  h4Number = 0;
      
                  entries.push({
                      heading,
                      number : `${h3Number}.`,
                      level  : 3
                  });
      
              } else {
      
                  if (!h3Number) return;
      
                  h4Number++;
      
                  entries.push({
                      heading,
                      number : `${h3Number}.${h4Number}`,
                      level  : 4
                  });
              }
          });
      
          const listHtml = entries.length
              ? entries.map(item => `
                  <li class="toc-level-${item.level}">
                      <a
                          href="#${item.heading.id}"
                          onclick="scrollToArticleHeading(event,'${item.heading.id}')">
      
                          <span class="toc-number">
                              ${item.number}
                          </span>
      
                          <span class="toc-text">
                              ${esc(item.heading.innerText)}
                          </span>
      
                      </a>
                  </li>
              `).join("")
              : "<li>此文章無 H3/H4 標題</li>";
      
          $("table-of-contents").innerHTML =
              listHtml;
      
          const firstH3 =
              body.querySelector("h3");
      
          if (!firstH3 || !entries.length) return;
      
          const nav =
              document.createElement("nav");
      
          nav.className =
              "inline-article-toc";
      
          nav.setAttribute(
              "aria-label",
              "本篇文章目錄"
          );
      
          nav.innerHTML = `
              <div class="inline-article-toc-head">
      
                  <span class="inline-article-toc-title">
                      📂 本篇目錄
                  </span>
      
                  <span class="inline-article-toc-note">
                      右上角 ≡ 打開也可以看到
                  </span>
      
              </div>
      
              <ol class="inline-article-toc-list">
                  ${listHtml}
              </ol>
          `;
      
          firstH3.parentNode.insertBefore(
              nav,
              firstH3
          );
      }
      function localDateString() {
        const p = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Taipei",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date());
        const o = Object.fromEntries(p.map((x) => [x.type, x.value]));
        return `${o.year}-${o.month}-${o.day}`;
      }
      function showAnnouncementIfActive() {
        const enabled = settingsCache.announcement_enabled === "true",
          title = (settingsCache.announcement_title || "網站公告").trim(),
          content = (settingsCache.announcement_content || "").trim(),
          start = settingsCache.announcement_start || "",
          end = settingsCache.announcement_end || "",
          today = localDateString();
        if (
          !enabled ||
          !content ||
          !start ||
          !end ||
          today < start ||
          today > end
        )
          return closeAnnouncement();
        $("announcement-modal-title").textContent = title || "網站公告";
        $("announcement-modal-content").textContent = content;
        $("announcement-modal").classList.remove("hidden");
        document.body.style.overflow = "hidden";
      }
      function closeAnnouncement() {
        $("announcement-modal").classList.add("hidden");
        document.body.style.overflow = "";
      }
      async function checkSessionState() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        $("floating-btn-text").innerText = session ? "網站管理" : "網站管理";
      }
      async function openAdminPanel() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) location.href = "/admin.html";
        else $("login-modal").classList.remove("hidden");
      }
      async function loginWithEmail() {
        const email = $("admin-email-input").value,
          password = $("admin-password-input").value;
        if (!email || !password) return alert("請輸入帳號與密碼");
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) return alert("登入失敗：" + error.message);
        location.href = "/admin.html";
      }
      
      function closeLoginModal() {
        $("login-modal").classList.add("hidden");
      }
      
      
      
      
      function applyCategoryOrder() {
        if (!categoryOrder.length) return;
        const rank = new Map(categoryOrder.map((id, i) => [String(id), i]));
        categoriesCache.sort(
          (a, b) =>
            (rank.get(String(a.id)) ?? 9999) - (rank.get(String(b.id)) ?? 9999),
        );
      }
      
      async function loadSettings() {
        const { data, error } = await supabaseClient
          .from("settings")
          .select("*");
        if (error) {
          console.error("設定讀取失敗：", error);
          return;
        }
        settingsCache = Object.fromEntries(
          (data || []).map((x) => [x.key, x.value]),
        );
        try {
          categoryOrder = JSON.parse(settingsCache.category_order || "[]");
        } catch {
          categoryOrder = [];
        }
        try {
          journeyEntries = JSON.parse(settingsCache.travel_entries || "[]");
        } catch {
          journeyEntries = [];
        }
        applyCategoryOrder();
        renderFrontendNav();
        renderLatestArticles();
        renderDiscountCodes();
        renderSocialPlatforms();
        renderSidebarAds();
        renderInternalLinks();
        const heroImage = $("site-logo-image");
        if (settingsCache.logo) {
          preloadImage("hero-image-preload", settingsCache.logo, "high");
          heroImage.src = settingsCache.logo;
          heroImage.hidden = false;
        } else {
          preloadImage("hero-image-preload", "");
          heroImage.removeAttribute("src");
          heroImage.hidden = true;
        }
        if (settingsCache.avatar) {
          $("site-avatar").src = settingsCache.avatar;
        } else {
          $("site-avatar").removeAttribute("src");
        }
        $("site-nickname").textContent = settingsCache.nickname || "zz";
        $("site-bio").textContent = settingsCache.bio || "一個隨筆紀錄的人";
      }
     
    </script>
  </body>
