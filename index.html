    <script>
      const SUPABASE_URL = "https://rpzqioezweftrjtrneos.supabase.co",
        SUPABASE_ANON_KEY = "sb_publishable__8VdnjBQYgeFtPdArs4lww_4RJxrDye";
      let supabaseClient;
      async function initSupabase(){
        if(supabaseClient) return supabaseClient;
        const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
        supabaseClient = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return supabaseClient;
      }
      let allArticlesCache = [],
        categoriesCache = [],
        settingsCache = {},
        journeyEntries = [],
        categoryOrder = [];
      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          ),
        jsq = (s) =>
          String(s ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");

      function preloadImage(id, url, fetchPriority = "high") {
        const imageUrl = String(url || "").trim();
        let link = document.getElementById(id);

        if (!imageUrl) {
          link?.remove();
          return;
        }

        if (!link) {
          link = document.createElement("link");
          link.id = id;
          link.rel = "preload";
          link.as = "image";
          document.head.appendChild(link);
        }

        link.href = imageUrl;
        link.fetchPriority = fetchPriority;
      }

      function normalizeSlug(v) {
        return String(v || "")
          .trim()
          .replace(/^\/+|\/+$/g, "")
          .replace(/\s+/g, "-")
          .replace(/[^A-Za-z0-9_-]/g, "")
          .replace(/-+/g, "-");
      }
      function fallbackSlug() {
        return "article-" + Date.now();
      }
      function categoryByName(n) {
        return categoriesCache.find((c) => c.name === n);
      }
      function categorySlug(n) {
        const c = categoryByName(n);
        return normalizeSlug(c?.slug);
      }
      function safePath(parts) {
        const clean = parts.map(normalizeSlug).filter(Boolean);
        return clean.length
          ? "/" + clean.map(encodeURIComponent).join("/")
          : "/";
      }
      function categoryPath(n) {
        const c = categoryByName(n);
        if (!c) return "/";
        const parts = [];
        if (c.parent_id) {
          const parent = categoriesCache.find((x) => x.id === c.parent_id);
          parts.push(parent?.slug);
        }
        parts.push(c.slug);
        return safePath(parts);
      }
      function articlePath(a) {
        const parts = [categorySlug(a.category)];
        if (a.subcategory) parts.push(categorySlug(a.subcategory));
        parts.push(normalizeSlug(a.slug) || fallbackSlug());
        return safePath(parts);
      }

          .querySelector(
            'meta[name="description"]'
          )
          ?.setAttribute(

        history.pushState(state, "", safe);

      function hideRelatedArticles() {
        const section = $("related-articles-box");

      }
      async function renderRelatedArticles(article) {
        const section = $("related-articles-box"),
          list = $("related-articles-list");
        if (!section || !list || !article?.id) return;
        let ids = [];
        try {
          const parsed = JSON.parse(settingsCache[relatedSettingsKey(article.id)] || "[]");
          ids = Array.isArray(parsed) ? parsed.map(String).filter((id) => id !== String(article.id)) : [];
        } catch {
          ids = [];
        }
        if (!ids.length) {
          list.innerHTML = "";
          section.classList.add("hidden");
          return;
        }
        const cached = new Map(allArticlesCache.map((item) => [String(item.id), item]));
        const missingIds = ids.filter((id) => !cached.has(id));
        if (missingIds.length) {
          const { data, error } = await supabaseClient
            .from("articles")
            .select("id,title,category,subcategory,slug,created_at,updated_at,excerpt,cover_image_url")
            .in("id", missingIds);
          if (error) console.error("延伸閱讀讀取失敗：", error);
          (data || []).forEach((item) => {
            cached.set(String(item.id), item);
            if (!allArticlesCache.some((a) => String(a.id) === String(item.id))) allArticlesCache.push(item);
          });
        }
        const related = ids.map((id) => cached.get(id)).filter(Boolean);
        if (!related.length) {
          list.innerHTML = "";
          section.classList.add("hidden");
          return;
        }
        list.innerHTML = related.map((a) =>
          `<li><a href="${articlePath(a)}" onclick="event.preventDefault();viewSingleArticle('${a.id}')" class="block"><span class="block font-semibold">${esc(a.title)}</span><span class="block text-xs opacity-60 mt-1">${formatArticleDate(a.created_at)}</span></a></li>`
        ).join("");
        section.classList.remove("hidden");
      }

      async function handleCurrentRoute() {
        const parts = decodeURIComponent(location.pathname).split("/").filter(Boolean);
        if (!parts.length || parts[0] === "index.html") {
          await fetchArticles();
          showAnnouncementIfActive();
          return;
        }
        const last = parts.at(-1);
        const { data: routeArticle, error: routeError } = await supabaseClient
          .from("articles")
          .select("*")
          .eq("slug", last)
          .maybeSingle();
        if (routeError) console.error(routeError);
        if (routeArticle && decodeURIComponent(articlePath(routeArticle)).toLowerCase() === ("/" + parts.join("/")).toLowerCase()) {
          return viewSingleArticle(routeArticle.id, { updateHistory: false, article: routeArticle });
        }
        const cat = categoriesCache.find((c) =>
          decodeURIComponent(categoryPath(c.name)).toLowerCase() === ("/" + parts.join("/")).toLowerCase()
        );
        if (cat) return cat.name === "我的旅途"
          ? viewJourney({ updateHistory: false })
          : fetchArticles(cat.name);
        showNotFound();
      }

      function resolveJourneyArticle(url) {
        let path = String(url || "");
        try { path = new URL(path, location.origin).pathname; } catch {}
        return allArticlesCache.find(
          (a) => decodeURIComponent(articlePath(a)).toLowerCase() === decodeURIComponent(path).toLowerCase(),
        );
      }

          const article = resolveJourneyArticle(url);
          const href = article ? articlePath(article) : url;
          const title = article ? article.title : url;
          const click = article ? ` onclick="event.preventDefault();viewSingleArticle('${article.id}')"` : ' target="_blank" rel="noopener noreferrer"';
          return `<a href="${esc(href)}"${click}>${esc(title)}</a>`;
        }).join("")}</div>`;
      }

          content = (settingsCache.announcement_content || "").trim(),
          start = settingsCache.announcement_start || "",
          end = settingsCache.announcement_end || "",
          today = localDateString();

          !enabled ||
          !content ||

          !end ||

          return closeAnnouncement();

      async function loginWithEmail() {
        const email = $("admin-email-input").value,
          password = $("admin-password-input").value;
        if (!email || !password) return alert("請輸入帳號與密碼");
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) return alert("登入失敗：" + error.message);
        location.href = "/admin.html";
      }
      
      function closeLoginModal() {
        $("login-modal").classList.add("hidden");
      }
      
      
      
      
      function applyCategoryOrder() {
        if (!categoryOrder.length) return;
        const rank = new Map(categoryOrder.map((id, i) => [String(id), i]));
        categoriesCache.sort(
          (a, b) =>
            (rank.get(String(a.id)) ?? 9999) - (rank.get(String(b.id)) ?? 9999),
        );
      }
      
      async function loadSettings() {
        const { data, error } = await supabaseClient
          .from("settings")
          .select("*");
        if (error) {
          console.error("設定讀取失敗：", error);
          return;
        }
        settingsCache = Object.fromEntries(
          (data || []).map((x) => [x.key, x.value]),
        );
        try {
          categoryOrder = JSON.parse(settingsCache.category_order || "[]");
        } catch {
          categoryOrder = [];
        }
        try {
          journeyEntries = JSON.parse(settingsCache.travel_entries || "[]");
        } catch {
          journeyEntries = [];
        }
        applyCategoryOrder();
        renderFrontendNav();
        renderLatestArticles();
        const heroImage = $("site-logo-image");
        if (settingsCache.logo) {
          preloadImage("hero-image-preload", settingsCache.logo, "high");
          heroImage.src = settingsCache.logo;
          heroImage.hidden = false;
        } else {
          preloadImage("hero-image-preload", "");
          heroImage.removeAttribute("src");
          heroImage.hidden = true;
        }
        if (settingsCache.avatar) {
          $("site-avatar").src = settingsCache.avatar;
        } else {
          $("site-avatar").removeAttribute("src");
        }
        $("site-nickname").textContent = settingsCache.nickname || "zz";
        $("site-bio").textContent = settingsCache.bio || "一個隨筆紀錄的人";
      }
     
    </script>
  </body>
</html>
